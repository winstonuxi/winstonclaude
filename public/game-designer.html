 |\n|---|---|---|\n| Producer (制作人) | Chọn làm game nào, lịch, ngân sách | Roadmap |\n| Lead designer (主策划, 主策) | Duyệt concept, giữ chất lượng thiết kế | Duyệt one-pager, GDD |\n| **Game designer, feature designer** (玩法策划) | Theme, feature, luật chơi, presentation | One-pager, GDD, spec |\n| System designer (系统策划) | Hệ thống ngoài game: lobby, VIP, nhiệm vụ, giải đấu | System spec |\n| Math designer, game mathematician (数值策划) | Reel strip, paytable, simulation, PAR sheet. Dùng Excel, Python hoặc R để chạy Monte Carlo (tổng hợp từ tin tuyển dụng ngành). Một trong những vai trò khan hiếm nhất ([mmccaa](https://mmccaa-site.pages.dev/blog/slot-industry-jobs-and-workflow-en)) | Math spec, PAR sheet, báo cáo sim |\n| Junior designer (执行策划) | Viết chi tiết, điền bảng config (配置表), help text, kiểm build | Config, help, danh sách bug |\n| Live-ops designer (活动策划, 运营策划) | Sự kiện, giải đấu, khuyến mãi sau launch | Event spec |\n| Art team (主美, 原画, UI, 动效, 特效) | Xem [giao-trinh-digital-art-slot-2026-11-08](digital-art.html), mục 1.1 | Asset |\n| Client dev (前端, 客户端) | Hiển thị reel, animation, âm thanh, chạy trên nhiều máy. Thường dùng PixiJS, Cocos Creator, Phaser, Unity cho 3D ([mmccaa](https://mmccaa-site.pages.dev/blog/slot-industry-jobs-and-workflow-en)) | Build |\n| Server dev (后端, 服务端) | RNG, logic, ví, kết nối operator, lịch sử ván. Thường dùng Go, Java, Node.js, C++ (cùng nguồn) | RGS |\n| QA (测试) | Test chức năng, math, thiết bị, hiệu năng, compliance | Bug report |\n| Compliance (合规) | Hồ sơ gửi lab, luật từng thị trường | Hồ sơ certification |\n\nStudio TQ thường **giữ thiết kế lõi và math ở trong nhà**, còn art thì outsource nhiều, và hay A/B test các biến thể math ([mmccaa](https://mmccaa-site.pages.dev/blog/slot-industry-jobs-and-workflow-en)).\n\n### 3.2. Game designer slot làm gì trong 1 vòng game\n1. **Research:** chơi demo game đối thủ, đọc bảng xếp hạng lobby, viết bảng phân tích (竞品分析).\n2. **Đề xuất:** viết one-pager, pitch với lead và producer.\n3. **Thiết kế:** viết GDD. Gửi yêu cầu math. Gửi danh sách asset và brief style cho art.\n4. **Chỉnh cảm giác:** chơi bản prototype hàng nghìn spin cùng math, chỉnh nhịp, anticipation, tần suất feature.\n5. **Theo sản xuất:** trả lời câu hỏi, duyệt art theo spec, viết spec animation, viết help text.\n6. **Nghiệm thu:** đi kiểm build (走查), xác nhận bug là bug thật hay đúng thiết kế.\n7. **Launch:** viết game sheet, mô tả feature cho operator, kiểm tra bản dịch.\n8. **Sau launch:** đọc data, viết 复盘 (rút kinh nghiệm), đề xuất phiên bản sau.\n\n### 3.3. Thang nghề và đích cho Winston\n\n| Cấp | Làm được | Lương tham khảo ở studio TQ (tháng) |\n|---|---|---|\n| Junior (执行策划) | Viết chi tiết theo GDD người khác, điền config, help text, test build | Thấp hơn mức dưới |\n| **Game Designer** | Tự làm từ one-pager đến GDD cho 1 game, làm việc trực tiếp với math | **15.000–30.000 RMB** (khoảng 2.100–4.200 USD) |\n| Senior | Thiết kế mechanic mới, đọc data sau launch, kèm junior | Cao hơn mức trên |\n| Lead (主策) | Roadmap cả series, duyệt mọi thứ, chiến lược thị trường | |\n\nNguồn lương: [mmccaa](https://mmccaa-site.pages.dev/blog/slot-industry-jobs-and-workflow-en). Trang này có link quảng cáo casino, nên chỉ xem như mức tham khảo. Mức Game Designer **vượt ngưỡng 2.000 USD/tháng** của Winston, nhưng nhớ điều kiện thứ hai: công ty phải có license hợp pháp.\n\n| Winston đã có | Cần bù |\n|---|---|\n| UI, visual hierarchy, cảm nhận chuyển động, branding, logo, Figma | Từ vựng ngành, đọc math, viết spec kiểu game (state, timing, edge case), thư viện feature, đọc data |\n\n---\n\n# PHẦN B. QUY TRÌNH\n\n## 4. Quy trình làm game mới của studio TQ\n\n> **Lưu ý trung thực:** studio slot TQ không công bố quy trình nội bộ. Khung dưới đây ghép từ: mô tả quy trình 8 giai đoạn trên một blog ngành có phần riêng về studio TQ ([mmccaa](https://mmccaa-site.pages.dev/blog/slot-industry-jobs-and-workflow-en)), hướng dẫn của vendor phương Tây ([Inkration](https://www.littlestuff.co.uk/?p=41375), [SourceCodeLab](https://sourcecodelab.co/slot-game-development-features-process/), [Whimsy Games](https://igaming.whimsygames.co/blog/casino-game-development-outsourcing-guide/)), tin tuyển dụng, quy trình chung của ngành game TQ (立项 → 策划 → 研发 → 测试 → 上线 → 运营), và kinh nghiệm nghề. Các nguồn khớp nhau ở phần khung, khác nhau ở thời gian.\n\n### 4.1. Dây chuyền 8 bước, 4 điểm duyệt\n\n```mermaid\nflowchart TB\n    S0[\"⓪ 竞品分析 / 选题<br/>research, chọn theme và mechanic\"] --> S1[\"① 立项 Greenlight<br/>one-pager · ✅ Gate 1\"]\n    S1 --> S2[\"② 策划案 + 数值初版<br/>GDD và math v1 · ✅ Gate 2: khóa GDD\"]\n    S2 --> S3[\"③ 原型 Prototype<br/>bản xám chạy math thật · ✅ Gate 3: chốt cảm giác chơi\"]\n    S3 --> S4[\"④ 研发 Sản xuất song song<br/>art · client · server · math bản cuối\"]\n    S4 --> S5[\"⑤ 测试 QA<br/>chức năng, math, thiết bị, hiệu năng\"]\n    S5 --> S6[\"⑥ 认证 Certification<br/>chỉ với thị trường có license · ✅ Gate 4\"]\n    S6 --> S7[\"⑦ 上线 Launch<br/>tích hợp, bộ marketing, bản demo\"]\n    S7 --> S8[\"⑧ 运营 + 复盘<br/>live-ops, đọc data, rút kinh nghiệm\"]\n    S8 -. data cho game sau .-> S0\n```\n\n### 4.2. Chi tiết từng bước\n\n| Bước | Mục tiêu | Output | Designer làm gì | Thời gian (ước tính) |\n|---|---|---|---|---|\n| ⓪ **Research** (竞品分析, 选题) | Chọn theme và mechanic có cơ hội ở thị trường đích | Bảng phân tích 10–20 game, xu hướng | Chơi demo, teardown (bài B1.1), đọc bảng xếp hạng lobby | 1–3 tuần ([SourceCodeLab](https://sourcecodelab.co/slot-game-development-features-process/)) |\n| ① **Greenlight** (立项) | Được duyệt cho làm | One-pager (mục 15) | Viết và pitch | Vài ngày |\n| ② **GDD + math v1** (策划案, 数值初版) | Khóa luật chơi và mục tiêu math | GDD v1.0, bảng mục tiêu math, math v1 | Viết GDD, gửi yêu cầu math (mục 16.3), gửi asset list để art làm style key | Math 2–4 tuần. Đây là bước hay bị **đánh giá thấp nhất**, và phải sim hơn 10 triệu vòng trước khi khóa (cùng nguồn) |\n| ③ **Prototype** (原型, 灰盒) | Kiểm tra cảm giác chơi trước khi tốn tiền làm art | Bản chạy được, art tạm, math thật | Chơi hàng nghìn spin, chỉnh nhịp, anticipation, tần suất feature | 1–3 tuần |\n| ④ **Sản xuất** (研发) | Làm thật, song song | Art, Spine, client, server, âm thanh | Duyệt art, viết spec animation, help text, kiểm build (走查) | Art 4–8 tuần ([Whimsy Games](https://igaming.whimsygames.co/blog/casino-game-development-outsourcing-guide/)) |\n| ⑤ **QA** (测试) | Game chạy đúng và đúng math | Báo cáo test: chức năng, tải, math (kết quả thực khớp thiết kế), đa nền tảng ([Inkration](https://www.littlestuff.co.uk/?p=41375)) | Viết tiêu chí nghiệm thu, phân xử bug | 1–3 tuần |\n| ⑥ **Certification** (认证, 送检) | Lab độc lập kiểm RNG, RTP, bảo mật, luật địa phương | Chứng nhận | Rule, help text khớp math, trả lời câu hỏi lab | Vài tuần đến vài tháng, tùy độ phức tạp và thị trường (cùng nguồn) |\n| ⑦ **Launch** (上线) | Lên operator qua API | Bản tích hợp, bản dịch, analytics, bộ marketing. Launch mà không có analytics là \"làm việc mù\" (cùng nguồn) | Game sheet, mô tả feature, video, kiểm bản dịch | 1–2 tuần |\n| ⑧ **Live-ops, 复盘** (运营) | Theo dõi, sửa lỗi, cập nhật theo luật mới | Báo cáo, bản vá, 复盘 | Đọc data, viết 复盘, đề xuất phiên bản sau | Liên tục |\n\n### 4.3. Tổng thời gian: các nguồn nói gì\n\n| Nguồn | Game thường | Game phức tạp | Reskin |\n|---|---|---|---|\n| Các trang vendor (tổng hợp từ [SourceCodeLab](https://sourcecodelab.co/slot-game-development-features-process/), [Game-Ace](https://game-ace.com/slot-game-development/), [Whimsy Games](https://igaming.whimsygames.co/blog/casino-game-development-outsourcing-guide/)) | 8–16 tuần | 18–24 tuần | 4–6 tuần |\n| [mmccaa](https://mmccaa-site.pages.dev/blog/slot-industry-jobs-and-workflow-en) | Cả vòng 2–6 tháng. Studio TQ ra 2–4 game/tháng. Studio lớn như Pragmatic Play chạy hơn 10 game song song | | |\n\n**Kết luận để lập kế hoạch:** mechanic mới khoảng 4 tháng, reskin khoảng 1–1,5 tháng. Thị trường cần certification thì cộng thêm thời gian lab.\n\n```mermaid\ngantt\n    title Game có mechanic mới, khoảng 18 tuần nếu có certification (ước tính)\n    dateFormat YYYY-MM-DD\n    axisFormat %d/%m\n    section Thiết kế\n    Research và one-pager        :a1, 2027-01-04, 14d\n    GDD và math v1               :a2, after a1, 21d\n    Prototype và chỉnh cảm giác  :a3, after a2, 14d\n    section Sản xuất\n    Style key và art và Spine    :b1, after a1, 56d\n    Client dev                   :b2, after a3, 42d\n    Server và math bản cuối      :b3, after a2, 42d\n    section Ra mắt\n    QA                           :c1, after b2, 14d\n    Certification                :c2, after c1, 21d\n    Bộ launch và tích hợp        :c3, after c1, 14d\n```\n\n**Reskin (换皮), khoảng 5–6 tuần (ước tính)**\n\n| Tuần | Việc |\n|---|---|\n| 1 | Brief theme, asset list, style key. Xác nhận với math: có đổi paytable không |\n| 2–4 | Art và Spine |\n| 3–5 | Client thay skin, thêm presentation riêng của theme |\n| 5–6 | QA. Certification lại nếu đổi math hoặc thị trường yêu cầu |\n\n### 4.4. Studio TQ khác studio phương Tây ở đâu\n\n| Khía cạnh | Studio TQ (出海) | Studio phương Tây | Nguồn |\n|---|---|---|---|\n| Thị trường | Đông Nam Á, Mỹ Latinh, Ấn Độ | UK, EU, Bắc Mỹ có license | [mmccaa](https://mmccaa-site.pages.dev/blog/slot-industry-jobs-and-workflow-en) |\n| Nhịp ra game | 2–4 game/tháng, nhiều reskin | Tùy studio, từ vài game/năm đến vài game/tháng | mmccaa, kinh nghiệm nghề |\n| Thiết bị | Ưu tiên **mobile dọc** (portrait), H5, nhẹ để chạy được máy yếu và mạng chậm | Desktop và mobile, nhiều game ngang (landscape) | Kinh nghiệm nghề |\n| Theme | 国风 (rồng, Thần Tài, mạt chược, cá chép), cộng theme theo từng thị trường | Thần thoại, phiêu lưu, kinh dị, văn hóa đại chúng | Kinh nghiệm nghề |\n| Math | A/B test biến thể math, nhiều phiên bản RTP | Math là bản sắc của studio | mmccaa |\n| Art | Outsource nhiều, ví dụ Thành Đô | Nhiều studio giữ art trong nhà | mmccaa, [giao-trinh-digital-art-slot-2026-11-08](digital-art.html) mục 2.5 |\n| Công cụ tài liệu | Tài liệu và bảng tính trên 飞书 (Feishu/Lark) hoặc Excel, giao UI qua 蓝湖 (Lanhu), task trên TAPD, 禅道 hoặc Jira | Confluence, Notion, Jira, Figma | Kinh nghiệm nghề |\n| Pháp lý | Có studio có license, có studio ở vùng xám | Phần lớn có license | **Luôn tự tra register** (mục 13.5) |\n\n### 4.5. 换皮 và series: cỗ máy ra game\n\n| Kiểu | 中文 | Là gì | Rủi ro | Designer lo gì |\n|---|---|---|---|---|\n| **Reskin** | 换皮 | Giữ code và math, thay theme. Có thể chỉnh paytable nhẹ | Thấp. Nhưng dễ nhạt nếu presentation giống hệt | Theme brief, asset list, khác biệt ở presentation |\n| **Cải tiến nhỏ** | 微创新 | Giữ khung, thêm 1 modifier (ví dụ thêm wild nhân) | Vừa | Thiết kế modifier, phối hợp math |\n| **Mechanic mới** | 新玩法 | Feature mới thật | Cao, lâu | Toàn bộ quy trình mục 4.1 |\n| **Series** | 系列 | Phiên bản 2, Deluxe, bản max win cao hơn, bản có jackpot… của game đã hit | Thấp, tận dụng tên tuổi | Giữ cái người chơi thích, đổi đủ để mới |\n\nStudio thường trộn nhiều reskin và cải tiến nhỏ với một vài game mechanic mới **(kinh nghiệm nghề)**. Junior thường bắt đầu từ reskin.\n\n---\n\n## 5. Theme và game story (主题, 世界观, 包装)\n\nSlot không có cốt truyện dài như game nhập vai. \"Story\" ở đây là **cách đóng gói (包装)** để mỗi phần của game mang một nghĩa trong cùng một thế giới.\n\n### 5.1. Chọn theme\n\n| Tiêu chí | Câu hỏi |\n|---|---|\n| Thị trường | Người chơi ở thị trường đích có thích theme này không? Có game nào cùng theme đang top lobby không? |\n| Đọc được | Theme có đủ 4–6 vật hoặc nhân vật để làm high symbol, mỗi cái một silhouette riêng không? |\n| Hợp feature | Feature có \"nghĩa\" trong theme không? Ví dụ: lồng đèn bay lên gắn với multiplier đi lên, cá chép vượt vũ môn gắn với nâng cấp symbol |\n| Khác biệt | So với 10 game cùng theme, mình khác ở đâu? |\n| Pháp lý, văn hóa | Có dính IP, người thật, biểu tượng tôn giáo không? (mục 5.3) |\n\n### 5.2. Cấu trúc story 5 lớp\n\n| Lớp | Là gì | Ví dụ với theme \"Lantern Sky\" (tên tạm, mục 15) |\n|---|---|---|\n| **Premise** | Một câu giới thiệu thế giới | Đêm hội thả đèn trời, mỗi chiếc đèn mang một điều ước may mắn |\n| **Cast** | Nhân vật và vật = high symbol | Cá chép vàng, lân, quạt giấy, trống hội |\n| **Setting** | Nền base game và nền free spins | Base: bờ sông lúc chiều. Free spins: bầu trời đêm đầy đèn |\n| **Escalation** | Feature như một hành trình đang tăng dần | Đèn bay lên từng hàng, multiplier cộng dồn: bầu trời càng sáng thì càng gần cú thắng lớn |\n| **Payoff** | Cao trào | Màn tổng kết: pháo hoa và cả bầu trời đèn |\n\n### 5.3. Văn hóa và điều cấm kỵ (kinh nghiệm nghề)\n\n| Thị trường | Nên | Tránh |\n|---|---|---|\n| Người Hoa | Số 8, đỏ và vàng, rồng, Thần Tài, nén vàng (元宝), cá chép | Số 4 (đồng âm với \"chết\") |\n| Đông Nam Á | Thần Tài, rồng, hổ, voi, lễ hội | Hình Phật và biểu tượng hoàng gia, nhất là ở Thái |\n| Ấn Độ | Lễ hội, màu sắc, cricket (không dùng tên đội thật) | Hình thần linh trong game cờ bạc |\n| Brazil | Rừng nhiệt đới, động vật, lễ hội, bóng đá (không dùng CLB thật) | Logo CLB, cầu thủ thật |\n| Mọi nơi | Thế giới tự đặt | Người thật, IP thật, logo operator hay game thật (*01 - projects/CLAUDE.md*) |\n\n### 5.4. Đặt tên game\n- Ngắn, đọc được ở nhiều ngôn ngữ, dễ tìm trong lobby.\n- Từ hay dùng: Fortune, Gold, Lucky, Riches, Wild, Mega, Ways.\n- **Tra trùng thương hiệu** trước khi chốt. Một số tên feature đã được đăng ký thương hiệu, ví dụ Megaways của Big Time Gaming, muốn dùng phải mua license. Trong spec, hãy dùng tên mô tả chung, như \"số hàng thay đổi theo reel\".\n\n### 5.5. Theme bible 1 trang (mẫu)\n\n```markdown\n# Theme bible: <tên game>\n- Premise (1 câu):\n- Cảm xúc chủ đạo (3 từ): ví dụ: rộn ràng, may mắn, ấm áp\n- Cast: H1 … H4 (vật/nhân vật, màu chủ đạo, silhouette), L1 … L5\n- Wild / Scatter / symbol đặc biệt: là gì trong thế giới này\n- Setting: base (nơi, giờ, ánh sáng) · free spins (đổi gì)\n- Feature trong story: feature X nghĩa là gì trong thế giới\n- Âm thanh: nhạc cụ chính, nhịp, âm thanh lúc thắng\n- Moodboard: 6–9 ảnh tham chiếu (chỉ để định hướng, không copy)\n- Cấm: những gì không được xuất hiện (IP, tôn giáo, người thật…)\n```\n\n---\n\n# PHẦN C. KIẾN THỨC CHUYÊN MÔN\n\n## 6. Slot: cấu trúc cơ bản\n\n### 6.1. Mô hình tư duy quan trọng nhất\n**Kết quả được quyết định ở server trước khi reel dừng. Reel quay chỉ là màn trình diễn.**\n- Server sinh số ngẫu nhiên (RNG), chọn vị trí dừng trên từng reel strip, tính thắng, gửi kết quả cho client. Client chỉ diễn lại kết quả đó ([mmccaa](https://mmccaa-site.pages.dev/blog/slot-industry-jobs-and-workflow-en)).\n- Hệ quả cho thiết kế:\n  - Không được thiết kế thứ gì mà người chơi \"điều khiển\" được kết quả, như chạm để dừng đúng lúc. UK cấm các feature tạo **ảo giác kiểm soát** ([Paul Hastings](https://paulhastings.com/insights/client-alerts/u-k-gambling-commission-announces-new-rules-on-game-design-targeting-online)).\n  - Anticipation (reel quay chậm khi đã có 2 Scatter) chỉ là cách **trình bày** một kết quả đã có sẵn.\n\n### 6.2. Lưới (盘面)\n\n| Lưới | Hay dùng cho |\n|---|---|\n| 3×3 | Slot cổ điển, game nhẹ |\n| 5×3 | Video slot tiêu chuẩn, line hoặc 243 ways |\n| 5×4 | 1024 ways, hold & win |\n| 6×5, 7×7 | Cascade, cluster pays, pay anywhere |\n| Số hàng thay đổi theo reel | Kiểu \"Megaways\" (thương hiệu của Big Time Gaming) |\n\n### 6.3. Cách tính thắng (中奖方式)\n\n| Kiểu | 中文 | Luật | Ví dụ tính |\n|---|---|---|---|\n| **Paylines** | 赔付线, 中奖线 | Symbol giống nhau trên một đường cố định, tính từ reel trái sang phải | 20 line, tổng cược 2,00 → cược mỗi line 0,10. Ba H1 trên line 5, paytable trả 50 lần line bet → thắng 5,00 |\n| **Ways** | 路 (243路, 1024路) | Symbol giống nhau trên các reel **liền nhau** từ trái, ở bất kỳ hàng nào. Số ways = số hàng mũ số reel: 3^5 = 243, 4^5 = 1024 | Reel 1 có 2 H1, reel 2 có 1, reel 3 có 1 → 2 × 1 × 1 = 2 ways. Paytable 3×H1 = 0,5 lần tổng cược, tổng cược 1,00 → thắng 2 × 0,5 × 1,00 = 1,00 |\n| **Cluster** | 连块 | Từ 5 symbol giống nhau trở lên, nối ngang hoặc dọc | |\n| **Pay anywhere** (scatter pays) | 任意位置 | Từ 8 symbol giống nhau trở lên ở bất kỳ đâu trên lưới | |\n\n> **Spec phải ghi rõ:** paytable tính theo **line bet** hay **tổng cược**. Thắng nhiều line thì cộng. Mỗi line chỉ trả combo cao nhất. Thắng Scatter cộng thêm vào thắng line. Thiếu một câu là dev hỏi lại, hoặc tệ hơn, code sai.\n\n### 6.4. Symbol\n\n| Loại | Mã thường dùng | 中文 | Vai trò |\n|---|---|---|---|\n| High | H1–H5 | 高分符号 | Trả cao, ít xuất hiện, nhân vật hoặc vật quý |\n| Low | L1–L5 | 低分符号 | Trả thấp, hay xuất hiện, A K Q J 10 hoặc đá quý |\n| Wild | WD | 百搭 | Thay thế symbol thường |\n| Scatter | SC | 分散, 夺宝 | Kích hoạt free spins, trả thưởng ở bất kỳ vị trí nào |\n| Bonus | BN | 奖励 | Kích hoạt bonus game |\n| Coin, cash | CN | 金币 | Mang giá trị tiền, dùng cho hold & win, collect |\n| Multiplier | MP | 倍数 | Nhân thắng |\n| Mystery | MY | 神秘 | Lật ra cùng một symbol |\n\n### 6.5. Cược (投注)\n- **Bet ladder** (danh sách mức cược): ví dụ 0,20 · 0,40 · 1 · 2 · 4 · 10 · 20 · 50 · 100 (minh họa). Spec ghi mức mặc định, mức thấp nhất, cao nhất.\n- **Khóa đổi cược** khi đang trong feature.\n- Thị trường có giới hạn cược tối đa (ví dụ UK, Đức, mục 13). Bet ladder phải chỉnh được theo thị trường bằng config.\n\n### 6.6. Các chế độ của một game\n\n| Chế độ | 中文 | Là gì |\n|---|---|---|\n| Base game | 主游戏, 基础游戏 | Chế độ quay thường |\n| Free spins | 免费游戏, 免费旋转 | Lượt quay miễn phí, thường có modifier |\n| Bonus game | 奖励游戏, 小游戏 | Mini game riêng: chọn quà, vòng quay |\n| Respin | 重转 | Quay lại một phần lưới |\n| Buy feature | 购买免费游戏 | Trả tiền để vào thẳng feature |\n\n---\n\n## 7. Thư viện feature\n\n### 7.1. Bảng feature (các mechanic phổ biến trong ngành)\n\n| Feature | 中文 | Cách chạy | Tạo cảm giác gì | Spec phải ghi |\n|---|---|---|---|---|\n| Wild | 百搭 | Thay symbol thường | Tăng số lần thắng | Thay được symbol nào (thường không thay Scatter), có trả thưởng riêng không |\n| Expanding wild | 扩展百搭 | Phủ cả reel | Thắng lớn theo reel | Lúc nào mở rộng, có trong base không |\n| Sticky wild | 粘性百搭 | Đứng yên nhiều lượt | Căng thẳng tích lũy | Ở lại bao lâu, có chồng nhau không |\n| Walking wild | 移动百搭 | Dịch 1 ô mỗi lượt | Người chơi \"chờ\" wild | Hướng đi, ra khỏi lưới thì sao |\n| Multiplier wild | 倍数百搭 | Wild kèm x2, x3… | Cú thắng lớn bất ngờ | Nhiều wild nhân thì **cộng hay nhân** |\n| Stacked symbols | 堆叠 | Symbol xếp chồng trên reel strip | Khoảnh khắc phủ kín reel | Chiều cao stack |\n| Free spins | 免费游戏 | Từ 3 Scatter trở lên | Feature chính của game | Bao nhiêu Scatter ra bao nhiêu lượt, modifier |\n| Retrigger | 再触发 | Thêm lượt trong lúc free spins | Kéo dài niềm vui | Giới hạn số lượt tối đa |\n| Cascade, tumble | 消除, 连消, 掉落 | Symbol thắng biến mất, symbol mới rơi xuống | Nhiều lần thắng trong 1 spin | Thứ tự tính, multiplier tăng theo từng lần rơi |\n| Progressive multiplier | 递增倍数 | Multiplier tăng theo cascade hoặc theo lượt | Leo thang | Tăng bao nhiêu, reset khi nào |\n| Hold & win (respin với coin) | 金币锁定重转 | Coin dính lại, còn 3 lượt respin, mỗi coin mới đặt lại về 3 | Hồi hộp từng lượt | Giá trị coin, đầy lưới thì trả gì |\n| Cash collect | 收集 | Symbol \"collector\" gom giá trị của các coin | Gom tiền | Thứ tự gom, collector nhân |\n| Mystery | 神秘符号 | Lật ra cùng một symbol | Bất ngờ | Lật thành được những symbol nào |\n| Symbol upgrade | 符号升级 | Low biến thành high | Tiến triển | Thứ tự nâng cấp |\n| Mở rộng lưới | 扩展盘面 | Thêm hàng, thêm ways | Lưới \"lớn lên\" | Tối đa bao nhiêu |\n| Multiplier pay anywhere | 倍数符号 | Các symbol multiplier cộng dồn rồi nhân tổng thắng | Bùng nổ cuối spin | Cộng trong 1 spin hay cả feature |\n| Jackpot cố định 4 cấp | 迷你 / 小 / 大 / 巨奖 | Mini, Minor, Major, Grand | Mục tiêu rõ ràng | Trả theo lần cược hay số cố định |\n| Progressive jackpot | 累积奖池 | Một phần mỗi lần cược vào quỹ, có bộ đếm hiển thị ([Gamix Labs](https://gamixlabs.com/blog/designing-paytables-and-bonus-features-in-slot-game-mechanics)) | Giấc mơ lớn | % đóng góp, quỹ khởi điểm, chung mạng hay riêng |\n| Bonus chọn quà, vòng quay | 选择, 翻牌, 转盘 | Mini game | Đổi nhịp | Bảng giải thưởng và xác suất do math |\n| Buy feature | 购买免费游戏 | Trả N lần cược để vào thẳng free spins | | Giá (thường quanh 100 lần cược, **kinh nghiệm nghề**), RTP riêng, **tắt được theo thị trường** |\n| Ante bet, double chance | 加注 | Trả thêm một phần cược để tăng xác suất trigger | | Mức tăng giá, RTP khi bật |\n| Gamble, double-up | 比倍 | Đoán màu bài để gấp đôi tiền thắng | | Bị hạn chế ở nhiều thị trường |\n| Persistent meter | 持续收集 | Thanh tích lũy qua nhiều spin | Lý do để quay tiếp | **Phải hiển thị rõ.** Lưu riêng theo từng mức cược để không bị lợi dụng |\n\n### 7.2. Combo hay gặp ở game châu Á (nhận định, kinh nghiệm nghề)\n- **Cascade + multiplier tăng dần mỗi lần rơi**, free spins thì multiplier cao hơn. Dòng game mạt chược của PG Soft là ví dụ điển hình của hướng này.\n- **Hold & win + 4 cấp jackpot cố định**, rất phổ biến ở cả máy land-based lẫn online.\n- **Pay anywhere + multiplier cộng dồn**, có buy feature.\n- Theme 国风 + symbol vàng biến thành wild.\n\nHọc mechanic, **không** chép art, tên, symbol hay bố cục của game thật.\n\n### 7.3. Feature cần cẩn thận\n- **Feature đã đăng ký thương hiệu** (Megaways, xWays, xNudge…): dùng tên mô tả chung trong spec.\n- **Buy feature:** UK đã cấm từ 2019 (theo nhiều nguồn ngành, cần kiểm tra lại). Thiết kế để tắt được bằng config.\n- **Autoplay, turbo, slam stop:** UK cấm từ 31/10/2021, Đức cấm autoplay (mục 13.2).\n- **\"Pity timer\", tăng tỷ lệ theo thời gian chơi:** một blog vendor gợi ý tăng dần xác suất bonus sau mỗi 20 spin không trúng, hoặc gắn tỷ lệ bonus với thời gian chơi ([Gamix Labs](https://gamixlabs.com/blog/designing-paytables-and-bonus-features-in-slot-game-mechanics)). Ở thị trường có license, cơ chế làm xác suất thay đổi theo lịch sử người chơi thường **bị cấm**, hoặc phải là feature tích lũy có hiển thị và công bố rõ. Hỏi compliance trước khi đưa vào spec.\n\n---\n\n## 8. Math cho designer\n\n> Mục tiêu: hiểu đủ để **đặt mục tiêu, đọc báo cáo, đặt câu hỏi đúng**. Phần tính toán sản xuất là việc của math designer.\n\n### 8.1. Từ vựng math\n\n| Thuật ngữ | 中文 | Nghĩa |\n|---|---|---|\n| **RTP** (Return to Player) | 返奖率, 返还率 | % tiền cược trả lại người chơi về lâu dài. RTP = tổng thắng / tổng cược. Phổ biến 94–97% ([Inkration](https://www.littlestuff.co.uk/?p=41375)) |\n| House edge | 庄家优势 | 100% − RTP |\n| **Hit frequency** | 中奖率, 命中率 | % số spin có thắng bất kỳ, kể cả thắng nhỏ hơn tiền cược |\n| **Volatility** | 波动性 | Kết quả dao động mạnh hay nhẹ. Đo bằng độ lệch chuẩn (SD). Hai game cùng RTP có thể có volatility rất khác nhau |\n| Volatility index (VI) | 波动指数 | Con số volatility trong PAR sheet, gắn với một mức độ tin cậy |\n| **Trigger frequency** | 触发率 | Feature xuất hiện trung bình 1 lần mỗi N spin. Ví dụ: 1/300 so với 1/80 tạo cảm giác hoàn toàn khác dù cùng RTP (cùng nguồn) |\n| **RTP split** | RTP 占比 | Phần RTP đến từ base game, từ free spins, từ bonus |\n| **Max win** | 最高赢分, 封顶 | Mức thắng tối đa một vòng, ví dụ 5.000 lần cược. Chạm mức này thì feature dừng |\n| Win distribution | 赢分分布 | Bảng % spin thắng 0x, 0–1x, 1–5x, 5–20x… |\n| Reel strip | 轮带, 卷轴带 | Dãy symbol trên mỗi reel. Base và free spins thường dùng strip khác nhau |\n| Weight | 权重 | Số \"vị trí ảo\" của mỗi symbol, quyết định xác suất ([mmccaa](https://mmccaa-site.pages.dev/blog/slot-math-model-par-sheet-en)) |\n| **PAR sheet** | 概率报告 | \"Bản thiết kế\" toán học của game: reel strip, paytable, xác suất, RTP, hit frequency, volatility ([easy.vegas](https://www.easy.vegas/games/slots/par-sheets)) |\n| Simulation | 模拟, 蒙特卡洛 | Chạy hàng triệu đến hàng tỷ spin giả lập để kiểm tra math ([mmccaa](https://mmccaa-site.pages.dev/blog/slot-math-model-par-sheet-en)) |\n| Confidence interval | 置信区间 | Khoảng RTP thực tế sẽ rơi vào sau N spin, với một mức tin cậy nhất định |\n| RNG | 随机数生成器 | Bộ sinh số ngẫu nhiên, được lab kiểm tra |\n| LDW (loss disguised as win) | | \"Thắng\" nhưng nhận về ít hơn hoặc bằng tiền cược. UK cấm ăn mừng kiểu thắng này (mục 13) |\n\n### 8.2. Bài tính tay: slot 3 reel đồ chơi\nTự tính một lần là hiểu RTP, hit frequency, volatility hơn đọc 10 bài.\n\n**Thiết lập:** 3 reel, mỗi reel 10 vị trí: 7 có 1 vị trí, BAR có 2, CHERRY (C) có 3, BLANK có 4. Tổng số kết quả = 10 × 10 × 10 = **1.000**. Cược 1.\n\n| Combo | Số kết quả | Cách đếm |\n|---|---|---|\n| 7-7-7 | 1 | 1 × 1 × 1 |\n| BAR-BAR-BAR | 8 | 2 × 2 × 2 |\n| C-C-C | 27 | 3 × 3 × 3 |\n| C-C-(không phải C) | 63 | 3 × 3 × 7 |\n| **Tổng kết quả có thắng** | **99** | |\n\n**Phiên bản A**\n\n| Combo | Trả | Số kết quả × trả |\n|---|---|---|\n| 7-7-7 | 300 | 300 |\n| BAR×3 | 40 | 320 |\n| C×3 | 10 | 270 |\n| C-C-x | 1 | 63 |\n| **Tổng** | | **953 → RTP = 953 / 1.000 = 95,3%** |\n\n- Hit frequency = 99 / 1.000 = **9,9%**.\n- Nhưng 63 trong 99 lần \"thắng\" chỉ trả **đúng bằng tiền cược**. Tỷ lệ thắng thật sự (nhận về nhiều hơn tiền cược) chỉ có **3,6%**. Đây chính là LDW: ở UK không được ăn mừng những lần này.\n\n**Phiên bản B:** đổi C-C-x từ 1 lên 2 → tổng = 300 + 320 + 270 + 126 = 1.016 → **RTP 101,6%**. Studio lỗ. Chỉ đổi một con số nhỏ mà RTP nhảy 6 điểm.\n\n**Phiên bản C:** giữ C-C-x = 2, hạ 7-7-7 từ 300 xuống 240 → 240 + 320 + 270 + 126 = 956 → **RTP 95,6%**.\n\n**Volatility của A và C** (độ lệch chuẩn mỗi spin, tính bằng công thức Var = E[X²] − (E[X])²)\n\n| | E[X²] | SD | Đọc thế nào |\n|---|---|---|---|\n| A | (300² + 8×40² + 27×10² + 63×1²) / 1.000 = 105,6 | khoảng **10,2** | Dồn RTP vào giải lớn → biến động mạnh |\n| C | (240² + 8×40² + 27×10² + 63×2²) / 1.000 = 73,4 | khoảng **8,5** | Chuyển RTP xuống thắng nhỏ → êm hơn, thắng thật thường hơn |\n\n**Bài học:** RTP gần như không đổi (95,3% và 95,6%), nhưng **cảm giác chơi khác hẳn**. Designer nói chuyện với math bằng **cảm giác muốn có**, ví dụ \"thắng thật khoảng 1/10 spin, giải lớn nhất không quá 300x\", còn math tìm con số để đạt cảm giác đó.\n\n### 8.3. RTP split và công thức tính nhanh cho feature\nVí dụ phân bổ của một video slot 5 reel RTP 96% ([mmccaa](https://mmccaa-site.pages.dev/blog/slot-math-model-par-sheet-en)):\n\n| Nguồn RTP | Đóng góp |\n|---|---|\n| Base game, symbol thấp | 33,6% |\n| Base game, symbol cao | 19,2% |\n| Thắng nhờ Wild | 9,6% |\n| Thắng Scatter | 4,8% |\n| Free spins | 24,0% |\n| Bonus game | 4,8% |\n| **Tổng** | **96%** |\n\n**Công thức nhanh:** RTP của feature ≈ xác suất trigger × số lượt × multiplier trung bình × thắng trung bình mỗi lượt.\nVí dụ: trigger 1/200, 10 lượt, multiplier x3, thắng trung bình mỗi lượt 1,5 lần cược → (1/200) × 10 × 3 × 1,5 = **22,5%**. Muốn tổng 96% thì base game phải gánh 73,5% (cùng nguồn).\n\nMuốn base game có RTP 95% chỉ bằng paytable là **rất khó**. Đó là lý do feature gánh một phần lớn RTP (cùng nguồn).\n\n### 8.4. Xác suất trigger Scatter: bài tập xác suất nhị thức\n5 reel, mỗi reel có xác suất 6% hiện Scatter (ở vùng nhìn thấy). Xác suất có từ 3 Scatter trở lên:\n- Đúng 3: C(5,3) × 0,06³ × 0,94² ≈ 0,00191\n- Đúng 4: 5 × 0,06⁴ × 0,94 ≈ 0,00006\n- Đúng 5: 0,06⁵ ≈ 0,0000008\n- **Tổng ≈ 0,197% ≈ 1/507 spin** (khớp với [mmccaa](https://mmccaa-site.pages.dev/blog/slot-math-model-par-sheet-en))\n\nThay đổi trọng số Scatter khác nhau giữa các reel làm tình huống \"thiếu 1 Scatter\" xuất hiện nhiều hơn (cùng nguồn). Một số thị trường như New Jersey cấm cố tình lập trình near-miss (cùng nguồn).\n\n### 8.5. Hit frequency tham khảo\n\n| Kiểu game | Hit frequency |\n|---|---|\n| 3 reel cổ điển, volatility cao | 8–12% |\n| 3 reel cổ điển, volatility thấp | 15–25% |\n| Video slot 5 reel | 25–35% |\n| Megaways | 30–45% |\n| Cluster pays | 20–30% |\n\nNguồn: [mmccaa](https://mmccaa-site.pages.dev/blog/slot-math-model-par-sheet-en). Đây là blog, xem như dải tham khảo. Một vendor khác nói free spins thường trigger sau khoảng 50–80 spin ([Gamix Labs](https://gamixlabs.com/blog/designing-paytables-and-bonus-features-in-slot-game-mechanics)). Con số thật thay đổi theo từng game.\n\n### 8.6. Designer quyết gì, math quyết gì\n\n| Designer đặt mục tiêu | Math tìm cách đạt |\n|---|---|\n| Volatility mong muốn (thấp, vừa, cao) và **lý do** (thị trường, người chơi) | Reel strip, weight, paytable cụ thể |\n| Feature chạy thế nào (rule) | Phân bổ RTP giữa base và feature |\n| Tần suất feature mong muốn (khoảng) | Trigger rate thực tế |\n| Max win, có buy feature không | Xác suất chạm max win, RTP của buy |\n| Các phiên bản RTP cần cho từng thị trường hoặc khách | Sim, PAR sheet, xác nhận làm được |\n| **Cả hai cùng làm:** chơi prototype, chỉnh cho đến khi số liệu và cảm giác cùng đạt | |\n\n### 8.7. 10 câu hỏi khi đọc PAR sheet hoặc báo cáo sim\n1. RTP của từng phiên bản là bao nhiêu? Base chiếm bao nhiêu %, feature bao nhiêu %, buy feature bao nhiêu %?\n2. Hit frequency là bao nhiêu? Bao nhiêu % spin nhận về **nhiều hơn** tiền cược?\n3. Feature trigger trung bình 1/N spin? 90% số lần trigger nằm trong khoảng bao nhiêu spin?\n4. Feature trả trung bình bao nhiêu lần cược? Bao nhiêu % feature trả dưới 10 lần cược (feature \"hụt\")?\n5. Max win là bao nhiêu, xác suất chạm là bao nhiêu? Chạm thì feature dừng ngay chứ?\n6. Bảng phân bố thắng theo các mức 0x, 0–1x, 1–5x, 5–20x, 20–100x, trên 100x?\n7. Sim bao nhiêu spin? Khoảng tin cậy của RTP là bao nhiêu? Ngành thường sim từ 1 tỷ spin trở lên cho game hiện đại ([mmccaa](https://mmccaa-site.pages.dev/blog/slot-math-model-par-sheet-en))\n8. Có trạng thái tích lũy không? Lưu theo mức cược hay theo người chơi?\n9. Chuỗi spin không thắng gì (dry spell) dài trung bình bao nhiêu?\n10. Các phiên bản RTP khác nhau ở chỗ nào: paytable, reel strip hay trigger rate?\n\n### 8.8. Nhiều phiên bản RTP và chỉnh RTP theo người chơi: khác nhau thế nào\n\n| | Nhiều phiên bản RTP (hợp lệ) | Chỉnh theo người chơi (gian lận) |\n|---|---|---|\n| Là gì | Studio làm sẵn vài phiên bản đã được lab chứng nhận, ví dụ 96% / 94% / 92%. Operator chọn một khi cấu hình | Tỷ lệ thắng bị đổi theo từng người chơi hoặc theo thời gian thực: 点控, 杀率 |\n| Người chơi có biết không | RTP hiển thị trong help | Không |\n| Ở thị trường có license | Được phép, theo quy định từng nơi | **Bất hợp pháp** |\n\n### 8.9. Bắn cá và crash: hai công thức khái niệm\n- **Bắn cá:** cá có hệ số m, mỗi phát bắn tốn b. Nếu xác suất bắt được mỗi lần trúng là p, thì kỳ vọng mỗi phát = p × m × b. Muốn RTP cố định thì p ≈ RTP / m. Ví dụ RTP 96%, cá 50x → p ≈ 1,92%. **Hệ quả:** ở game bắn cá kiểu casino, mỗi phát có kỳ vọng gần như nhau dù bắn cá nào, vì cá càng giá trị thì càng khó bắt. Kỹ năng ngắm chủ yếu tạo cảm giác, ít đổi RTP. Đây là công thức khái niệm, game thật có thêm cá bom, cá sét và nhiều cơ chế khác.\n- **Crash:** xác suất hệ số đạt ít nhất M ≈ (1 − house edge) / M. Với house edge 3%: đạt 2x là 48,5%, đạt 10x là 9,7%, đạt 100x là 0,97%. **Hệ quả:** rút ở mức nào thì kỳ vọng cũng là 97% tiền cược, không chiến thuật nào đổi được điều này ([Degen docs](https://intercom.help/degen/en/articles/14306688-game-events), [Philipp Dubach](https://philippdubach.com/posts/against-all-odds-the-mathematics-of-provably-fair-casino-games/)).\n\n---\n\n## 9. Presentation: nhịp, animation, âm thanh\n\nCùng một math, presentation tốt hay dở quyết định game được chơi hay bị bỏ. Đây là chỗ **Winston có lợi thế nhất**.\n\n### 9.1. Giải phẫu một spin\n\n```mermaid\nflowchart LR\n    A[\"Bấm Spin\"] --> B[\"Reel tăng tốc\"]\n    B --> C[\"Quay đều<br/>chờ kết quả server\"]\n    C --> D[\"Dừng lần lượt<br/>reel 1 → 5\"]\n    D --> E{\"Có 2 Scatter?\"}\n    E -- có --> F[\"Anticipation<br/>reel còn lại quay chậm\"]\n    E -- không --> G[\"Tính thắng\"]\n    F --> G\n    G --> H[\"Trình bày thắng<br/>line, symbol, đếm tiền\"]\n    H --> I[\"Idle\"]\n```\n\n### 9.2. Thời gian tham khảo (kinh nghiệm nghề, mỗi studio khác nhau)\n\n| Pha | Thời lượng ví dụ | Ghi chú |\n|---|---|---|\n| Bấm Spin đến lúc reel chạy | 0,1–0,2 giây | Phản hồi ngay khi chạm |\n| Quay đều tối thiểu | 0,8–1,5 giây | Đủ để nhận kết quả từ server |\n| Khoảng cách dừng giữa các reel | 0,1–0,25 giây | Có nảy nhẹ khi dừng |\n| Anticipation | Thêm 1–2 giây mỗi reel còn lại | Âm thanh tăng dần |\n| Trình bày thắng nhỏ | 1–2 giây | Không chặn spin tiếp theo |\n| Đếm tiền Big Win | 3–6 giây, cấp cao hơn thì dài hơn | **Chạm để bỏ qua** |\n| Một spin không thắng | khoảng 2–3 giây | **UK: tối thiểu 2,5 giây. Đức: 5 giây** (mục 13) |\n\n### 9.3. Các cấp thắng (win tiers)\n- Ví dụ cấu hình: Big Win từ 10x, Mega Win từ 25x, Super Win từ 50x tiền cược **(minh họa, mỗi studio khác nhau)**.\n- Mỗi cấp \"nặng\" hơn cấp trước: chữ to hơn, nhiều coin hơn, nhạc dài hơn.\n- **Đếm tiền (rollup, 滚分) nhảy cấp ngay trên màn hình:** Big → Mega → Super khi số tiền đi qua từng ngưỡng.\n- **Không ăn mừng LDW** ở UK: tiền nhận về nhỏ hơn hoặc bằng tiền cược thì không chơi hiệu ứng thắng ([SBC News](https://sbcnews.co.uk/featurednews/2021/02/02/ukgc-bans-online-slots-autoplay-and-quickspin-features/)).\n\n### 9.4. Màn feature\n| Màn | Nội dung | Lưu ý |\n|---|---|---|\n| Intro (触发) | Scatter nhảy múa, chuyển cảnh, \"Bạn nhận được 10 lượt miễn phí\" | Có nút Bắt đầu, hoặc tự chạy sau vài giây |\n| Trong feature | Nền khác, nhạc khác, bộ đếm lượt, tổng thắng feature | Người chơi luôn biết còn bao nhiêu lượt |\n| Retrigger | \"+5 lượt\" | Không làm đứt nhịp |\n| Outro (结算) | Tổng thắng cả feature, đếm tiền | Chạm để bỏ qua |\n\n### 9.5. Âm thanh (音效需求)\n- Mỗi event cần một âm thanh: reel dừng, symbol rơi, Scatter rơi (mỗi Scatter cao giọng hơn), anticipation, các cấp thắng, intro và outro feature, nút bấm.\n- Nhạc nền base và nhạc free spins khác nhau. Có nút tắt riêng nhạc và hiệu ứng.\n\n---\n\n## 10. UX/UI cho slot và cổng game\n\n### 10.1. Thành phần UI của một game slot\n\n| Thành phần | Trạng thái cần thiết kế | Lưu ý |\n|---|---|---|\n| Nút Spin | normal, pressed, disabled, đang quay, autoplay đang bật | To nhất, nằm trong vùng ngón cái. Spin, bet, autoplay, paytable đều phải bấm được bằng 1 ngón cái trên mobile **(kinh nghiệm nghề)** |\n| Chọn mức cược | +/−, danh sách, khóa khi đang feature | Hiển thị đúng tiền tệ |\n| Số dư | Bình thường, đang cập nhật, không đủ tiền | |\n| Ô tiền thắng | 0, đang đếm, tổng | |\n| Autoplay | | **Tắt** ở UK, Đức |\n| Turbo, quick spin | | **Tắt** ở UK |\n| Buy feature | normal, disabled (đang feature, không đủ tiền, thị trường cấm) | Popup xác nhận giá |\n| Menu | Help và paytable, âm thanh, lịch sử, về lobby | |\n| Thông tin bắt buộc theo thị trường | RTP, đồng hồ, thời gian chơi, lãi lỗ cả phiên (UK) | |\n\n### 10.2. Help và paytable phải có gì (kinh nghiệm nghề)\n- Luật chơi, cách tính thắng, các combo.\n- Paytable hiển thị **bằng tiền**, thay đổi theo mức cược đang chọn.\n- Giải thích từng feature, có hình minh họa.\n- RTP (mỗi phiên bản hiện RTP của chính nó), max win, giới hạn cược.\n- Câu chuẩn: *\"Malfunction voids all pays and plays\"* (lỗi hệ thống thì mọi ván và mọi khoản trả đều vô hiệu).\n- Số phiên bản game.\n\nMột GDD mẫu dành hẳn một phần riêng cho \"Help, paytable and disclosures\" ([mẫu GDD](https://math-gdd-dev.chowchowhome.duckdns.org/templates/slot-gdd-template.html), bản nháp nội bộ, chỉ để tham khảo).\n\n### 10.3. Dọc hay ngang\n- Hơn 70% lượt cược diễn ra trên mobile, theo một vendor ([Inkration](https://www.littlestuff.co.uk/?p=41375)).\n- Studio châu Á thường thiết kế **dọc trước**. Lưới ở trên, nút điều khiển ở dưới trong vùng ngón cái, chừa vùng an toàn cho tai thỏ và thanh điều hướng.\n- Luôn thiết kế đủ 3 bố cục: dọc, ngang, desktop. Asset nền vẽ dư mép ([giao-trinh-digital-art-slot-2026-11-08](digital-art.html), mục 2.4).\n\n### 10.4. UX cổng game (phần hợp nhất với Winston)\n\n| Flow | Phải làm tốt | Lỗi hay gặp |\n|---|---|---|\n| Đăng ký, xác minh tuổi, KYC | Ít bước, báo rõ cần giấy tờ gì, lưu tiến độ | Bắt KYC lúc rút tiền mà không báo trước |\n| Tìm game | Danh mục, tìm kiếm, lọc theo studio, mới, hot, có jackpot | Lobby chỉ là một lưới icon dài |\n| Ô game (game tile) | Icon, tên, studio, nhãn mới/hot/jackpot, nút chơi thử nếu thị trường cho phép | Icon không đọc được ở cỡ nhỏ |\n| Nạp tiền | Rõ phí, rõ thời gian | |\n| Rút tiền | **Dễ như nạp.** Hiện trạng thái, thời gian dự kiến. UK cấm hủy lệnh rút để chơi tiếp ([UKGC](https://www.gamblingcommission.gov.uk/print/online-games-design-and-reverse-withdrawals)) | Giấu nút rút |\n| Khuyến mãi | Điều kiện rõ ràng, thanh tiến độ wagering | Điều kiện khó hiểu, chữ nhỏ |\n| VIP, nhiệm vụ, giải đấu | Mục tiêu rõ, bảng xếp hạng | |\n| Chơi có trách nhiệm | Truy cập trong tối đa 2 lần chạm, từ mọi màn | Giấu trong menu sâu |\n| Lịch sử, hỗ trợ | Lịch sử từng ván, lịch sử giao dịch, chat hỗ trợ | |\n\nAudit cổng game bằng khung trong *01 - projects/CLAUDE.md* (Nielsen, flow, content, visual, accessibility, performance). Thêm một lớp riêng cho ngành: **chơi có trách nhiệm và dark pattern** (mục 13.3).\n\n---\n\n## 11. Bắn cá, game bài, table game, crash\n\n### 11.1. Bắn cá (捕鱼)\n\n| Thành phần | 中文 | Designer phải spec |\n|---|---|---|\n| Phòng theo mức cược | 房间 (初级 / 中级 / 高级) | Dải cược mỗi phòng |\n| Pháo và mức cược | 炮台, 炮倍 | Các mức, đổi pháo |\n| Cá thường | 小鱼, 中鱼, 大鱼 | Bảng cá: mã, tên, dải hệ số, tốc độ, kích thước, kiểu đường đi, trọng số xuất hiện |\n| Boss | BOSS | Lịch xuất hiện, hệ số, màn báo động |\n| Cá đặc biệt | 炸弹鱼 (bom), 闪电 (sét lan), 冰冻 (đóng băng), 钻头 (mũi khoan) | Luật tác động, hệ số tối đa |\n| Đội hình cá | 鱼阵 | Kịch bản các đợt cá |\n| Kỹ năng | 锁定 (khóa mục tiêu), 自动 (tự bắn) | Điều kiện dùng. Kiểm tra thị trường có cấm tự động không |\n| Nhiều người chơi | 座位 (4–6 ghế) | Đồng bộ, hiển thị người khác bắn |\n| VFX, âm thanh | | Theo cấp hệ số khi bắt được cá |\n\nAsset và hướng sản xuất bắn cá: *game-ui-ai-workflow-2026-11-04*, mục 4. Math: mục 8.9.\n\n### 11.2. Game bài P2P (棋牌)\n**Rule doc phải có:** bộ bài, số người, chia bài, thứ tự lượt, nước đi hợp lệ, thứ tự mạnh yếu, các trường hợp thắng đặc biệt (ví dụ Tiến Lên: tới trắng, chặt heo), cách tính tiền cuối ván, xử lý hòa.\n\n| Edge case | Câu hỏi spec phải trả lời |\n|---|---|\n| Hết giờ lượt | Bao nhiêu giây? Hết giờ thì tự đánh gì? |\n| Mất kết nối | Bao lâu thì hệ thống chơi thay (托管)? Quay lại thì sao? |\n| Bàn thiếu người | Chờ bao lâu? Có bot không? Nếu có bot thì **phải công bố** |\n| Phí bàn | Thu bao nhiêu, hiển thị ở đâu (rake, 抽水) |\n| Thông đồng | Dấu hiệu nào thì đánh dấu để kiểm tra (串通) |\n\n**Hai mô hình phòng ở TQ:** 房卡 (mua thẻ để mở phòng riêng chơi với bạn) và 金币场 (phòng chơi bằng coin). Mô hình 房卡 cộng với đổi tiền ngoài app hoặc đại lý đa cấp là dấu hiệu cờ bạc trái phép **(tin tức ngành, chưa dẫn nguồn)**.\n\n### 11.3. Table game RNG\n\n| Game | Luật trả chuẩn | Designer lo |\n|---|---|---|\n| Baccarat (百家乐) | Player 1:1, Banker 1:1 trừ 5% hoa hồng, Tie thường 8:1 | Bàn cược, chip, hiệu ứng nặn bài (咪牌), **bảng cầu (路单)**: 大路, 珠盘路, 大眼仔, 小路, 曱甴路. Người chơi châu Á xem bảng cầu rất kỹ |\n| Sic Bo (骰宝) | Tài/Xỉu 1:1, thua khi ra bộ ba | Ô cược, lịch sử, thống kê |\n| Rồng Hổ (龙虎) | Rồng/Hổ 1:1 | Nhịp nhanh |\n| Roulette | Theo luật châu Âu hoặc Mỹ | Bàn cược, cược nhanh |\n\n### 11.4. Crash và instant game\n- **Vòng chơi:** đếm ngược để đặt cược → hệ số tăng dần → \"nổ\" (crash). Người chơi rút tay hoặc đặt mức rút tự động. Nhiều game cho đặt 2 cược cùng lúc.\n- **Yếu tố xã hội:** danh sách người đang cược và đã rút, lịch sử điểm nổ.\n- **Provably fair:** trước vòng, hệ thống công bố mã hash của server seed. Sau vòng, công bố seed để người chơi tự kiểm tra rằng kết quả không bị sửa ([Deuces Cracked](https://www.deucescracked.com/crypto-gambling/casino/crash)). Designer cần thiết kế **màn kiểm tra** dễ hiểu. Provably fair chỉ chứng minh kết quả không bị sửa sau khi cược, không có nghĩa là có lợi cho người chơi ([Philipp Dubach](https://philippdubach.com/posts/against-all-odds-the-mathematics-of-provably-fair-casino-games/)).\n\n---\n\n## 12. Kỹ thuật đủ để nói chuyện với dev\n\n### 12.1. Chia việc client và server\n\n| Client (前端) | Server (后端, RGS) |\n|---|---|\n| Hiển thị reel, animation, âm thanh, UI | RNG, chọn vị trí dừng, tính thắng |\n| Hiệu ứng, đếm tiền | Lưu trạng thái ván (để khôi phục khi mất kết nối) |\n| Gửi yêu cầu spin, nhận kết quả | Gọi ví của operator: trừ cược, cộng thắng |\n| | Lịch sử và replay từng ván |\n\n### 12.2. RGS, aggregator, ví\n- **Seamless wallet:** tiền nằm ở ví của operator. Mỗi vòng, RGS gọi trừ cược và cộng thắng. **Transfer wallet:** chuyển tiền vào game trước rồi chơi.\n- **Free rounds khác free spins.**\n  - Free rounds là lượt miễn phí operator tặng người chơi (công cụ khuyến mãi). Ở một provider, ví nhận lệnh cược 0 đồng kiểu `freeRoundBet` rồi lệnh thắng kiểu `freeRoundWin` ([BlueOcean docs](https://blueoceangaming.atlassian.net/wiki/x/gIASS)).\n  - Free spins là feature trong game. Ở provider đó, suốt chuỗi free spins không có giao tiếp với ví, ví chỉ thấy một lần cược và một lần thắng tổng (cùng nguồn).\n  - Mỗi provider làm free rounds một kiểu, nên aggregator tốt sẽ gom về một lệnh chung ([iGaming Business](https://igamingbusiness.com/casino-games/slots/slots-roundtable-aggregators/)).\n- **Rollback và trùng mã giao dịch:** mã giao dịch có thể trùng giữa các người chơi, nên phải xử lý kèm mã định danh khác ([BlueOcean docs](https://blueoceangaming.atlassian.net/wiki/x/gIASS)). Designer không code, nhưng phải đưa tình huống \"trừ cược xong thì mất mạng\" vào danh sách edge case.\n\n### 12.3. Bảng config (配置表)\nỞ studio TQ, nhiều tham số nằm trong bảng config do designer (thường là 执行策划) điền, rồi xuất ra JSON cho game đọc **(kinh nghiệm nghề)**. Ví dụ (số minh họa):\n\n| symbol_id | name | type | pay_3 | pay_4 | pay_5 | wild_sub |\n|---|---|---|---|---|---|---|\n| H1 | Carp | high | 1,0 | 2,5 | 10 | yes |\n| L1 | A | low | 0,2 | 0,5 | 1,5 | yes |\n| SC | Moon | scatter | — | — | — | no |\n\nGhi rõ đơn vị ở tiêu đề: trả theo lần **tổng cược** hay lần **line bet**.\n\n### 12.4. Khôi phục khi mất kết nối (断线重连)\nNgười chơi mất mạng giữa free spins. Mở lại game thì phải về đúng lượt đang dở, đúng tổng thắng, đúng multiplier. Server lưu trạng thái, client vẽ lại. **Mọi feature trong GDD phải có một dòng \"khôi phục thế nào\".**\n\n### 12.5. Bản địa hóa và tiền tệ\n- Chữ dài ra khi dịch. Chừa chỗ, đừng bake chữ vào hình (trừ logo và Big Win).\n- Định dạng số: `1,000.50` (Anh) và `1.000,50` (Bồ Đào Nha, Brazil).\n- Tiền tệ có số lớn như VND, IDR: rút gọn K, M, B, và bộ chữ số bitmap phải có đủ ký tự.\n- Font phải có dấu tiếng Việt, chữ Thái.\n\n### 12.6. Hiệu năng (kinh nghiệm nghề)\n- Đặt ngân sách dung lượng cho lần tải đầu, hỏi dev con số mục tiêu. Asset của feature tải sau.\n- Test trên máy Android cấu hình thấp và mạng chậm, vì đó là máy của nhiều người chơi ở Đông Nam Á.\n- Mesh trong Spine chỉ dùng cho khoảnh khắc thắng, không dùng cho vòng quay liên tục ([giao-trinh-digital-art-slot-2026-11-08](digital-art.html), Level 6).\n\n### 12.7. Event analytics cần log\n`session_start`, `spin` (mức cược, thắng, có trigger không), `feature_trigger`, `feature_end` (tổng thắng), `buy_feature`, `bet_change`, `error`, `reconnect`, `session_end`. Không có analytics thì sau launch không biết game sống hay chết.\n\n---\n\n## 13. Compliance và chơi có trách nhiệm\n\n### 13.1. Vì sao designer phải biết\nLuật thay đổi trực tiếp thiết kế: tốc độ spin, nút nào được có, cái gì được ăn mừng. Studio giải quyết bằng cách làm **một game, nhiều cấu hình thị trường** (jurisdiction config). Mỗi tính năng nhạy cảm có một công tắc **(kinh nghiệm nghề)**.\n\n| Công tắc | Thị trường ví dụ cần tắt hoặc đổi |\n|---|---|\n| Autoplay | UK, Đức |\n| Turbo, quick spin, slam stop | UK |\n| Thời gian spin tối thiểu | UK 2,5 giây, Đức 5 giây |\n| Buy feature | UK |\n| Ăn mừng khoản thắng nhỏ hơn hoặc bằng tiền cược | UK |\n| Hiện lãi lỗ và thời gian của phiên | UK |\n| Cược tối đa | UK, Đức |\n| Gamble, double-up | Tùy nơi |\n| Phiên bản RTP | Tùy khách và thị trường |\n\n### 13.2. Luật theo thị trường (tóm tắt, phải đọc bản gốc trước khi làm dự án thật)\n\n| Thị trường | Điểm chính | Nguồn |\n|---|---|---|\n| **UK** (UKGC) | Từ 31/10/2021: spin không được nhanh hơn 2,5 giây. Cấm autoplay. Cấm feature tăng tốc. Cấm ăn mừng khoản trả nhỏ hơn hoặc bằng tiền cược. Cấm feature tạo ảo giác kiểm soát. Phải hiện tổng lãi lỗ và thời gian chơi trong phiên. Cấm hủy lệnh rút để chơi tiếp | [Paul Hastings](https://paulhastings.com/insights/client-alerts/u-k-gambling-commission-announces-new-rules-on-game-design-targeting-online), [SBC News](https://sbcnews.co.uk/featurednews/2021/02/02/ukgc-bans-online-slots-autoplay-and-quickspin-features/), [UKGC](https://www.gamblingcommission.gov.uk/print/online-games-design-and-reverse-withdrawals) |\n| UK, thêm | Buy feature bị cấm (từ 2019). Giới hạn cược slot online từ 2025: £5/spin cho người từ 25 tuổi, £2 cho người 18–24 | Kiến thức nền, **cần kiểm tra trên trang UKGC** |\n| **Đức** (GlüStV 2021) | Cược tối đa €1/spin (có tin đã nâng lên €5, chưa xác minh). Mỗi vòng tối thiểu 5 giây. Cấm autoplay. Cấm chơi nhiều slot cùng lúc trên một domain | [GlüStV 2021 (tiếng Anh)](https://www.gluecksspiel-behoerde.de/images/pdf/GluStV%202021%20english.pdf), [gaming.net](https://www.gaming.net/germany-raises-the-online-slots-max-stake-per-spin-from-1-to-5-euros/) |\n| **Brazil** | Game online phải được lab do SPA/MF công nhận chứng nhận, operator phải giữ chứng nhận còn hiệu lực. Lộ trình 2025–2026 có cơ sở dữ liệu người tự loại trừ | [Mattos Filho (ordinance)](https://www.mattosfilho.com.br/en/?p=106785), [Mattos Filho (agenda)](https://www.mattosfilho.com.br/en/unico/regulatory-agenda-betting-gambling-brazil/) |\n| **RTP tối thiểu** | Nevada 75%, New Jersey 83%, Malta 92% (một số loại), UK không có mức tối thiểu nhưng bắt hiển thị | [mmccaa](https://mmccaa-site.pages.dev/blog/slot-math-model-par-sheet-en) |\n| **Chuẩn của lab** | GLI-19 cho hệ thống game online, có phần RNG và phiên chơi (bản 4.0 dự thảo 07/2026). GLI-11 cho yêu cầu ở cấp game | [GLI-19 v3.0](https://gaminglabs.com/wp-content/uploads/2024/06/GLI-19-Interactive-Gaming-Systems-v3.0.pdf), [GLI-19 v4.0 draft](https://gaminglabs.com/wp-content/uploads/2026/07/EN-GLI-19-v4.0-DRAFT-2026-07-07.pdf) |\n| **Vùng xám châu Á** | Không có khung chơi có trách nhiệm | Vẫn giữ công tắc compliance, để game bán được sang thị trường có license |\n\n### 13.3. Chơi có trách nhiệm (RG) và dark pattern\n**Tính năng RG designer phải đưa vào thiết kế** (cổng game và game):\n- Giới hạn nạp, giới hạn lỗ, giới hạn thời gian phiên.\n- Reality check: popup định kỳ hiện thời gian đã chơi và lãi lỗ.\n- Tạm nghỉ (cool-off), tự loại trừ (self-exclusion), xác minh tuổi.\n- Link đến tổ chức hỗ trợ. Hiện RTP và lịch sử ván.\n\n**Dark pattern phải tránh**\n\n| Dark pattern | Vì sao |\n|---|---|\n| Ăn mừng khoản thắng nhỏ hơn tiền cược | UK cấm. Đánh lừa cảm nhận của người chơi |\n| Near-miss dàn dựng ngoài phân phối ngẫu nhiên | New Jersey cấm. Là gian lận |\n| Giấu tổng số tiền đã lỗ | UK bắt hiện |\n| Nút dừng khó tìm hơn nút chơi tiếp | Ép hành vi |\n| Đếm ngược thúc nạp tiền | Ép hành vi |\n| Điều kiện khuyến mãi mù mờ | Mất niềm tin, có thể vi phạm luật bảo vệ người tiêu dùng |\n| Cho hủy lệnh rút để chơi tiếp | UK cấm |\n\nĐọc thêm để hiểu vì sao luật cấm những thứ này: *Addiction by Design* (mục 20).\n\n### 13.4. Dấu hiệu đỏ: gặp là từ chối\n\n| Dấu hiệu | Nghĩa | Làm gì |\n|---|---|---|\n| 点控, 杀率, 杀分, \"RTP chỉnh được theo người chơi\" | Kết quả bị can thiệp theo từng người, không còn ngẫu nhiên | Từ chối |\n| Không có chứng nhận lab, không nói được số license | Rất có thể là vùng xám hoặc trái phép | Hỏi số license, tự tra (13.5) |\n| Hệ thống đại lý đa cấp (代理), hoa hồng theo tuyến dưới | Mô hình hay gắn với cờ bạc trái phép | Từ chối |\n| 房卡 cộng đổi tiền ngoài app | Như trên | Từ chối |\n| Yêu cầu làm giống hệt một game hit: art, tên, symbol | Rủi ro IP | Đổi brief hoặc từ chối |\n| Thị trường đích là người chơi ở VN, TH, TQ | Bất hợp pháp | Từ chối |\n| Chỉ trả tiền bằng crypto vào ví cá nhân, không hợp đồng | Rủi ro pháp lý và thuế | Hỏi luật sư, kế toán |\n\n**Từ hay gặp ở thị trường xám**, gặp thì đề cao cảnh giác: 点控 (chỉnh theo người chơi), 杀率 / 杀分 (tỷ lệ \"ăn\" của nhà cái khi bị chỉnh), 代理 (đại lý), 洗码 (hoàn tiền theo doanh số cược), 盘口 (nhà cái, sàn), 包网 (dịch vụ dựng sẵn cả trang casino).\n\n### 13.5. Kiểm tra license trước khi nhận việc\n1. Hỏi **tên pháp nhân và số license**.\n2. Tra trên **register chính thức** của regulator (MGA, UKGC, Curaçao, PAGCOR…). Không tin logo license trên website.\n3. Hỏi game đã được **lab nào chứng nhận**, xin số chứng nhận.\n4. Hợp đồng, thuế, nhận tiền: hỏi luật sư và kế toán.\n\n**Ví dụ vì sao phải tự tra:** hồ sơ trên Sigma ghi PG Soft có license MGA từ 2017 ([Sigma](https://sigma.world/play/games/pg-soft/)), một số trang thương mại ghi có cả UKGC, trong khi ReadWrite đưa tin MGA đã tước license của họ từ 2020 ([ReadWrite](https://readwrite.com/?p=499131)). Chưa kiểm chứng được bên nào đúng. Bài học: chỉ tin register của regulator.\n\n---\n\n# PHẦN D. VIẾT SPEC VÀ TRÌNH BÀY\n\n## 14. Bộ tài liệu chuẩn\n\n| # | Tài liệu | 中文 | Bước | Ai đọc | Ai viết |\n|---|---|---|---|---|---|\n| 1 | Phân tích đối thủ | 竞品分析 | ⓪ | Producer, lead | Designer |\n| 2 | **One-pager** | 立项书 | ① | Lead, producer | Designer |\n| 3 | Theme bible | 世界观, 美术风格说明 | ①–② | Art | Designer và art lead |\n| 4 | **GDD** | 策划案 | ② | Mọi phòng | Designer |\n| 5 | **Yêu cầu math** | 数值需求 | ② | Math | Designer |\n| 6 | Math spec, PAR sheet, báo cáo sim | 数值文档, 概率报告 | ②–④ | Designer, QA, lab | Math |\n| 7 | **Asset list, art brief** | 美术需求, 资源清单 | ② | Art | Designer |\n| 8 | **Spec animation và presentation** | 动效需求, 表现文档 | ③–④ | Spine animator, client | Designer |\n| 9 | UI flow, wireframe | 交互稿 | ②–③ | UI, client | Designer |\n| 10 | Danh sách âm thanh | 音效需求 | ③ | Audio | Designer |\n| 11 | Bảng config | 配置表 | ④ | Client, server | Junior designer |\n| 12 | Help, paytable text | 规则说明 | ④ | Người chơi, lab | Designer |\n| 13 | Test case | 测试用例 | ⑤ | QA | QA viết, designer duyệt |\n| 14 | Game sheet, bộ marketing | 游戏介绍 | ⑦ | Operator | Designer và marketing |\n| 15 | Postmortem | 复盘 | ⑧ | Team | Designer |\n\n**4 luật viết tài liệu**\n1. **Một nguồn sự thật:** GDD là gốc, các tài liệu khác link về GDD, không chép lại.\n2. **Có version và change log.** Mỗi lần sửa ghi: ngày, người sửa, sửa gì, ai cần biết.\n3. **Bản gửi dev không có \"TBD\".** Phần nào không áp dụng thì ghi N/A kèm lý do ngắn ([mẫu GDD](https://math-gdd-dev.chowchowhome.duckdns.org/templates/slot-gdd-template.html)).\n4. **Math spec là một tài liệu riêng.** Một mẫu tài liệu gọi math spec là \"hợp đồng toán học\" của game, còn PAR sheet chỉ là bằng chứng (cùng nguồn).\n\n---\n\n## 15. One-pager (立项)\n\n### 15.1. Mẫu\n\n```markdown\n# One-pager: <tên tạm>\n| Mục | Nội dung |\n|---|---|\n| Hook (1 câu) | [Theme] + [mechanic chính] + [điểm khác biệt] + [cảm xúc] |\n| Thị trường đích | (chỉ thị trường có license) |\n| Người chơi | Ai, thích gì |\n| Lưới và cách thắng | |\n| Feature chính | |\n| Free spins / bonus | |\n| Volatility mục tiêu | thấp / vừa / cao, vì sao |\n| Phiên bản RTP | theo yêu cầu thị trường |\n| Max win | …x tiền cược |\n| Buy feature | có / không, tắt được theo thị trường |\n| Tham chiếu | 2–3 game cùng mechanic (chỉ học mechanic) |\n| Khác biệt | So với tham chiếu, mình khác ở đâu |\n| Kiểu dự án | reskin / cải tiến nhỏ / mechanic mới |\n| Ước tính | số tuần, số người |\n| Rủi ro | 2–3 rủi ro lớn nhất |\n| Cần duyệt | Câu hỏi cho lead / producer |\n```\n\n### 15.2. Ví dụ đã điền: \"Lantern Sky\" (game tự nghĩ, tên tạm)\n\n| Mục | Nội dung |\n|---|---|\n| Hook | Mỗi chiếc đèn trời rơi xuống reel sẽ bay lên một hàng mỗi lượt và nhân thắng cho cả reel. Free spins là đêm hội: đèn không tắt mà tụ lại trên bầu trời, multiplier cộng dồn |\n| Thị trường đích | Thị trường có license ở châu Á và Mỹ Latinh. Không phục vụ người chơi VN, TH, TQ |\n| Lưới và cách thắng | 5×4, 1024 ways, tính từ trái sang phải |\n| Symbol | 4 high: cá chép vàng, lân, quạt giấy, trống hội. 5 low: A K Q J 10. Wild. Scatter (mặt trăng). Lantern: multiplier x2, x3, x5 |\n| Base game | Lantern xuất hiện ngẫu nhiên, mỗi lượt bay lên 1 hàng, bay khỏi lưới thì mất. Way thắng đi qua reel có lantern thì được nhân |\n| Free spins | 3 / 4 / 5 Scatter = 8 / 12 / 20 lượt. Lantern bay lên đến hàng trên cùng thì dừng lại, không mất. Nhiều lantern cùng reel thì cộng multiplier |\n| Volatility mục tiêu | Vừa đến cao. Lý do: người chơi châu Á quen cascade và multiplier, muốn có cú thắng lớn nhưng không quá khô |\n| Phiên bản RTP | Theo yêu cầu thị trường, math đề xuất |\n| Max win | 5.000x tiền cược, có cap |\n| Buy feature | Có, tắt được theo thị trường |\n| Tham chiếu | Nhóm game cascade + multiplier châu Á. Nhóm game có walking wild (chỉ học mechanic) |\n| Khác biệt | Multiplier di chuyển theo chiều dọc và **nhìn thấy trước** 1–3 lượt, nên người chơi có lý do để chờ đèn |\n| Kiểu dự án | Mechanic mới |\n| Ước tính | Khoảng 16–18 tuần (mục 4.3) |\n| Rủi ro | 1) Nhiều lantern trên nhiều reel: **cộng hay nhân** giữa các reel có thể làm max win quá dễ chạm, cần sim. 2) Animation đèn bay tốn hiệu năng trên máy yếu. 3) Theme đèn trời đã có nhiều game, phải khác ở presentation |\n| Cần duyệt | Multiplier giữa các reel cộng hay nhân? Cho phép buy feature không? |\n\n---\n\n## 16. GDD và các spec đi kèm\n\n### 16.1. Mẫu GDD slot\n\n```markdown\n# GDD: <tên game> · v<số> · <trạng thái: Draft / Review / Frozen>\n\n## 0. Kiểm soát tài liệu\n- Mã game · Tác giả · Người duyệt · Ngày\n- Change log: | Ngày | Version | Người sửa | Sửa gì | Ai cần biết |\n- Tài liệu liên quan: math spec (link) · asset list (link) · spec animation (link) · Figma (link)\n\n## 1. Tổng quan\n- Hook · Thị trường · Nền tảng (H5 mobile dọc, ngang, desktop)\n- Ngôn ngữ · Tiền tệ · Phiên bản RTP · Volatility mục tiêu · Max win\n\n## 2. Luật chơi\n- Lưới, cách tính thắng (line / ways / cluster / pay anywhere)\n- Paytable tính theo: tổng cược hay line bet\n- Luật cộng thắng: mỗi line/way chỉ trả combo cao nhất; thắng nhiều line thì cộng; thắng Scatter cộng thêm\n- Wild thay được symbol nào; Scatter trả thưởng thế nào\n- \"Malfunction voids all pays and plays\"\n\n## 3. Symbol\n| ID | Tên | Loại | Trả 3/4/5 (link math) | Wild thay được? | Có ở base / FS | Trạng thái animation |\n\n## 4. Cược\n- Bet ladder · Mặc định · Min / Max · Khóa đổi cược khi nào\n- Cược tối đa theo thị trường (config)\n\n## 5. Feature (mỗi feature một mục)\n- Trigger: điều kiện kích hoạt\n- Flow: từng bước\n- Luật: số lượt, retrigger, multiplier, giới hạn\n- Kết thúc khi nào (kể cả khi chạm max win)\n- Tương tác với feature khác\n- Khôi phục khi mất kết nối\n- Hiển thị: bộ đếm, tổng thắng, màn intro/outro\n\n## 6. Flow và state machine\n- Sơ đồ trạng thái (mục 16.2)\n- Bảng trạng thái: | Trạng thái | Vào khi | Làm gì | Ra khi | Nút nào bấm được |\n\n## 7. Presentation\n- Bảng thời gian (mục 9.2) · Anticipation · Các cấp thắng: ngưỡng và thời lượng\n- Danh sách âm thanh theo event · Màn intro / outro\n\n## 8. UI\n- Bố cục dọc, ngang, desktop (link Figma)\n- Thành phần và trạng thái (mục 10.1) · Menu · Lịch sử · Cài đặt\n- Help và paytable (mục 10.2)\n\n## 9. Edge case và khôi phục (checklist mục 16.6)\n\n## 10. Cấu hình theo thị trường\n| Công tắc | UK | Đức | Brazil | MGA | Mặc định |\n\n## 11. Bản địa hóa và tiền tệ\n- Ngôn ngữ · Định dạng số · Rút gọn số lớn · Font\n\n## 12. Analytics\n- Danh sách event và tham số (mục 12.7)\n\n## 13. Tiêu chí nghiệm thu (mục 16.7)\n\n## 14. Câu hỏi còn mở\n| Câu hỏi | Người trả lời | Hạn | Trạng thái |\n(Bản gửi dev: không còn câu hỏi chặn việc, không có \"TBD\")\n\n## 15. Thuật ngữ\n```\n\n### 16.2. State machine mẫu\n\n```mermaid\nstateDiagram-v2\n    [*] --> Idle\n    Idle --> Spinning : bấm Spin, đủ số dư\n    Idle --> LowBalance : bấm Spin, thiếu số dư\n    LowBalance --> Idle : đóng thông báo\n    Spinning --> Stopping : nhận kết quả từ server\n    Stopping --> Evaluate : reel cuối dừng\n    Evaluate --> Idle : không thắng\n    Evaluate --> WinShow : có thắng\n    Evaluate --> FSIntro : đủ Scatter, không có thắng\n    WinShow --> Idle : xong hoặc chạm bỏ qua\n    WinShow --> FSIntro : đủ Scatter\n    FSIntro --> FreeSpin : bấm Bắt đầu\n    FreeSpin --> FreeSpin : còn lượt hoặc retrigger\n    FreeSpin --> FSOutro : hết lượt hoặc chạm max win\n    FSOutro --> Idle : bấm Thu thưởng\n    Spinning --> Recovery : mất kết nối\n    FreeSpin --> Recovery : mất kết nối\n    Recovery --> Stopping : kết nối lại, lấy lại kết quả\n    Recovery --> FreeSpin : kết nối lại giữa free spins\n```\n\nMỗi trạng thái cần một dòng trong bảng: vào khi nào, làm gì, ra khi nào, **nút nào bấm được**. Dev client code gần như trực tiếp từ bảng này.\n\n### 16.3. Mẫu yêu cầu math (数值需求)\n\n```markdown\n# Yêu cầu math: <tên game> · v<số>\n- Lưới, cách thắng, danh sách symbol (link GDD)\n- Phiên bản RTP cần: … (thị trường nào dùng bản nào)\n- Volatility mục tiêu: … · Lý do: …\n- Hit frequency mong muốn: khoảng …\n- Feature trigger mong muốn: khoảng 1 / … spin\n- Feature trả trung bình mong muốn: khoảng …x\n- Tỷ lệ feature \"hụt\" (dưới 10x) tối đa: …\n- Max win: …x · Chạm max win thì feature dừng\n- Buy feature: giá …x · RTP của buy: …\n- Ante bet: có / không\n- Ràng buộc thị trường: cược tối đa, tốc độ spin, cấm buy…\n- Câu hỏi mở cho math: (ví dụ: multiplier giữa các reel cộng hay nhân?)\n- Cần nhận lại: PAR sheet · báo cáo sim (số spin, khoảng tin cậy) · bảng phân bố thắng · trả lời 10 câu ở mục 8.7\n```\n\n### 16.4. Mẫu asset list (资源清单)\n\n| ID | Tên file | Loại | Kích thước | Trạng thái, animation | Ưu tiên | Ghi chú |\n|---|---|---|---|---|---|---|\n| A01 | `sym_h1_carp` | Symbol | 512px | idle, land, win | P0 | High cao nhất, nhiều vàng nhất |\n| A02 | `sym_lantern_x2` | Symbol đặc biệt | 512px | land, rise (bay lên 1 hàng), apply | P0 | 3 biến thể x2, x3, x5 |\n| A03 | `bg_base_port` | Nền | 1080×1920 | parallax 3 lớp | P0 | Vẽ dư mép |\n| A04 | `txt_bigwin` | Chữ | | start, idle, end | P1 | Không bake số tiền |\n\nQuy ước tên file và quy cách giao: [giao-trinh-digital-art-slot-2026-11-08](digital-art.html), mục 2.4.\n\n### 16.5. Mẫu spec animation và presentation (动效需求)\n\n| Event | Kích hoạt khi | Asset | Thời lượng | Bỏ qua được? | Âm thanh | Ghi chú |\n|---|---|---|---|---|---|---|\n| Reel dừng | Mỗi reel dừng | Reel | 0,15 giây nảy | Không | `sfx_reel_stop` | |\n| Scatter rơi | Scatter dừng trên lưới | `sym_scatter` land | 0,6 giây | Không | `sfx_scatter_1/2/3` cao dần | |\n| Anticipation | Đã có 2 Scatter | Khung sáng reel còn lại | Thêm 1,5 giây mỗi reel | Không | `sfx_anticipation` | |\n| Lantern bay lên | Đầu mỗi lượt | `sym_lantern` rise | 0,4 giây | Không | `sfx_lantern_rise` | Chạy trước khi reel quay |\n| Big Win | Thắng từ 10x | `txt_bigwin` | 4 giây | Có | `mus_bigwin` | Đếm tiền nhảy cấp |\n\n### 16.6. Checklist edge case (dán vào mọi GDD)\n- [ ] Không đủ số dư khi bấm Spin, khi bấm buy feature\n- [ ] Mất kết nối: lúc đang quay, giữa free spins, lúc đang đếm tiền thắng\n- [ ] Trừ cược xong thì mất mạng (rollback do server lo, client hiển thị gì?)\n- [ ] Hết phiên đăng nhập (session timeout) giữa feature\n- [ ] Chạm max win giữa feature: dừng ngay, hiển thị thế nào?\n- [ ] Retrigger đúng lúc lượt cuối\n- [ ] Đổi cược, mở menu, bấm về lobby trong lúc feature\n- [ ] Bấm Spin liên tục rất nhanh\n- [ ] Ẩn app, nhận cuộc gọi, khóa màn hình giữa feature\n- [ ] Xoay màn hình giữa chừng\n- [ ] Số tiền rất lớn (VND, IDR): ô hiển thị có vừa không?\n- [ ] Chữ dịch dài hơn bản tiếng Anh\n- [ ] Free rounds của operator chạy song song với feature trong game\n- [ ] Cấu hình UK: không autoplay, không turbo, spin tối thiểu 2,5 giây, không ăn mừng LDW\n- [ ] Thắng bằng 0 nhưng có trigger feature (mục 16.2)\n\n### 16.7. Tiêu chí nghiệm thu (viết theo Given / When / Then)\n- **Given** đang ở free spins, còn 1 lượt, **When** lượt cuối ra 3 Scatter, **Then** cộng 8 lượt, bộ đếm hiện \"+8\", không vào màn outro.\n- **Given** cấu hình UK, **When** tổng nhận về của một spin nhỏ hơn hoặc bằng tiền cược, **Then** không chơi animation hay âm thanh thắng.\n- **Given** tổng thắng feature chạm 5.000x, **When** đang ở lượt bất kỳ, **Then** feature dừng ngay, vào outro, hiện thông báo đạt max win.\n\n---\n\n## 17. Pitch ý tưởng\n\n### 17.1. Công thức 1 câu (hook)\n**[Theme] + [mechanic chính] + [điểm khác biệt] + [cảm xúc]**\nVí dụ: \"Đêm hội đèn trời, nơi mỗi chiếc đèn bay lên nhân thắng cho cả reel, và người chơi nhìn thấy trước đèn sắp đến đâu, nên luôn có lý do để chờ.\"\n\n### 17.2. Pitch 5 phút, 6 slide\n\n| Slide | Nội dung | Mẹo |\n|---|---|---|\n| 1 | Hook + 1 hình mock màn hình (Figma) | Người nghe phải \"thấy\" game trong 10 giây |\n| 2 | Vì sao bây giờ: thị trường, xu hướng, khoảng trống | Số liệu phải có nguồn, không bịa |\n| 3 | Cách chơi: lưới, feature, flow | Một sơ đồ thay vì một đoạn văn |\n| 4 | Cảm giác và mục tiêu math | Volatility, tần suất feature, max win |\n| 5 | Trình bày: key art, video 15 giây của feature | Prototype Figma hoặc After Effects là đủ |\n| 6 | Ước tính, rủi ro, điều cần duyệt | Kết thúc bằng một câu hỏi cần quyết |\n\n### 17.3. Chuẩn bị trước 3 câu hỏi chắc chắn bị hỏi\n1. \"Khác gì game X?\" → trả lời bằng **mechanic**, không phải bằng theme.\n2. \"Math làm được không?\" → đã hỏi math trước chưa, rủi ro ở đâu.\n3. \"Bao lâu, bao nhiêu người?\" → dựa vào kiểu dự án (mục 4.5).\n\n**Lỗi hay gặp:** chỉ nói theme mà không nói mechanic. Nói \"game sẽ hay\" mà không có lý do. Không có hình.\n\n---\n\n## 18. Làm việc với từng phòng\n\n| Phòng | Họ cần gì từ bạn | Bạn cần gì từ họ | Nên nói | Đừng nói |\n|---|---|---|---|---|\n| **Math** | Luật chơi rõ, mục tiêu cảm giác, ràng buộc thị trường | PAR sheet, sim, trả lời mục 8.7 | \"Tôi muốn thắng thật khoảng 1/8 spin, feature khoảng 1/150, max 5.000x. Anh thấy chỗ nào khó?\" | \"Cho tôi RTP 96% là được\" (thiếu cảm giác, thiếu ràng buộc) |\n| **Art** | Asset list, theme bible, tham chiếu, thứ tự ưu tiên, kích thước | Style key sớm, file đúng quy cách | \"P0 là 4 high và Scatter, cần style key trước thứ Sáu\" | \"Làm cho đẹp vào\" |\n| **Client dev** | State machine, bảng thời gian, edge case, layout | Ước tính, cảnh báo hiệu năng | \"Trạng thái này thì nút nào bấm được?\" (bạn tự trả lời trước trong GDD) | Đổi luật khi họ đã code mà không ghi change log |\n| **Server dev** | Luật tính thắng, trạng thái cần lưu để khôi phục | Định dạng kết quả, giới hạn | \"Feature này cần lưu những gì để khôi phục?\" | |\n| **QA** | Tiêu chí nghiệm thu, phân xử bug nhanh | Bug report rõ ràng | \"Đây là đúng thiết kế, sửa ở GDD mục 5.2\" | \"Chắc là được\" |\n| **Compliance** | Danh sách feature nhạy cảm, thị trường đích | Ma trận luật | \"Feature này có bị coi là thay đổi xác suất theo lịch sử không?\" | |\n| **Producer** | Ước tính, rủi ro, lựa chọn có trade-off | Quyết định, ưu tiên | \"Bỏ buy feature thì tiết kiệm 1 tuần, mất thị trường X\" | |\n\n---\n\n# PHẦN E. HỌC\n\n## 19. Lộ trình 7 level và bài tập\n\n### 19.1. Tổng quan\n\n| Level | Chủ đề | Giờ (ước tính) | Output |\n|---|---|---|---|\n| 0 | Setup và từ vựng | 5 | Từ điển cá nhân, công cụ sẵn sàng |\n| 1 | Ngành, thể loại, teardown | 20 | 10 bảng teardown |\n| 2 | Slot core, feature, presentation | 30 | 20 thẻ feature, 3 state machine, 1 bảng timing |\n| 3 | Viết spec | 40 | **Bộ tài liệu đầy đủ cho 1 game gốc** (portfolio acehaus) |\n| 4 | Đọc hiểu math | 30 | Model 3 reel trong Google Sheets |\n| 5 | Thể loại khác và cổng game | 25 | Rule doc game bài, spec bắn cá mini, flow lobby và RG |\n| 6 | Senior: data, series, compliance, pitch | 30 | Pitch deck, ma trận compliance, 复盘 |\n| | **Tổng** | **khoảng 180** | |\n\n| Nhịp học | Xong sau khoảng |\n|---|---|\n| 6 giờ/tuần | 30 tuần |\n| 10 giờ/tuần | 18 tuần |\n| 15 giờ/tuần | 12 tuần |\n\n**Luật khi học**\n- **Chỉ chơi bản demo** (bản chơi thử không tiền) trên trang chính thức của studio. Không đăng ký, không nạp tiền.\n- Mỗi bài tập là một note con, link về note này.\n- Không chép art, tên, symbol của game thật vào bài làm portfolio.\n\n---\n\n### Level 0. Setup và từ vựng (5 giờ)\n| Việc | Chi tiết |\n|---|---|\n| Công cụ | Google Sheets, Figma, Obsidian (Mermaid có sẵn), app quay màn hình để đo thời gian |\n| Từ điển cá nhân | Chép 40 từ quan trọng nhất ở mục 21 vào một note, viết lại nghĩa bằng lời của mình |\n| Đọc | Mục 1–3 |\n\n**Tiêu chí đạt:** giải thích được 30 từ ở mục 21 mà không cần nhìn.\n\n### Level 1. Ngành, thể loại, teardown (20 giờ)\n**Kiến thức:** mục 1–4.\n\n| Mã | Bài | Output |\n|---|---|---|\n| B1.1 | Teardown 5 game slot của 5 studio khác nhau (mẫu bên dưới) | 5 bảng |\n| B1.2 | Teardown thêm 5 game cùng 1 mechanic (ví dụ cascade + multiplier) | Bảng so sánh, 3 điểm chung, 3 điểm khác |\n| B1.3 | Vẽ lại bản đồ ngành bằng lời của mình | 1 trang |\n| B1.4 | Đọc 5 tin tuyển dụng game designer slot. Lập bảng: kỹ năng yêu cầu, mình đã có, cần bù | 1 bảng |\n\n**Mẫu teardown (B1.1)**\n\n| Mục | Ghi chú |\n|---|---|\n| Game, studio | |\n| Lưới, cách thắng | |\n| RTP, max win, volatility (đọc trong help) | |\n| Symbol: số high, low, đặc biệt | |\n| Feature, cách trigger | |\n| Thời gian 1 spin không thắng (đo bằng video) | |\n| Các cấp thắng: ngưỡng, thời lượng | |\n| Feature intro, outro | |\n| UI: dọc hay ngang, nút, menu | |\n| 100 spin demo: bao nhiêu lần thắng, bao nhiêu lần feature | Mẫu nhỏ nên con số dao động mạnh, chỉ để cảm nhận |\n| 3 điểm hay · 3 điểm khựng | |\n| 1 ý tưởng học được | |\n\n**Tiêu chí đạt:** nhìn một game lạ, trong 5 phút nói được lưới, cách thắng, feature chính và volatility ước đoán.\n\n### Level 2. Slot core, feature, presentation (30 giờ)\n**Kiến thức:** mục 6, 7, 9.\n\n| Mã | Bài | Output |\n|---|---|---|\n| B2.1 | 20 thẻ feature, mỗi feature một note: cách chạy, tạo cảm giác gì, spec cần ghi, game ví dụ | 20 note |\n| B2.2 | Vẽ state machine (Mermaid) cho 3 game đã teardown | 3 sơ đồ |\n| B2.3 | Quay video 3 game, đo thời gian từng pha | Bảng timing như mục 9.2 |\n| B2.4 | Viết lại help text cho 1 game theo mục 10.2 | 1 trang |\n\n**Tiêu chí đạt:** giải thích được 20 feature cho người ngoài ngành. State machine có đủ trạng thái khôi phục.\n\n### Level 3. Viết spec (40 giờ). Bài tốt nghiệp phần thiết kế\n**Kiến thức:** mục 5, 14–18.\n\n| Mã | Bài | Output |\n|---|---|---|\n| B3.1 | Theme bible và one-pager cho 1 game gốc (Lantern Sky hoặc ý tưởng của mình) | 2 trang |\n| B3.2 | GDD đầy đủ theo mẫu 16.1 | GDD v1.0 |\n| B3.3 | Yêu cầu math (16.3), asset list (16.4), spec animation (16.5) | 3 tài liệu |\n| B3.4 | Wireframe dọc và ngang trong Figma | 2 màn hình chính và các popup |\n| B3.5 | **Dev review:** nhờ Claude đóng vai client dev rồi server dev, đọc GDD và liệt kê câu hỏi. Sửa GDD đến khi còn dưới 5 câu hỏi chặn việc | Danh sách câu hỏi, GDD v1.1 |\n\n**Tiêu chí đạt:** bộ tài liệu đủ để dev làm prototype. Đóng gói thành 1 case study \"doc pack\" cho acehaus.\n\n### Level 4. Đọc hiểu math (30 giờ)\n**Kiến thức:** mục 8.\n\n| Mã | Bài | Output |\n|---|---|---|\n| B4.1 | Tính tay lại mục 8.2. Rồi tự thiết kế lại để đạt RTP 96% ± 0,5% và hit frequency từ 15% trở lên. Phải đổi cả số vị trí trên reel, không chỉ paytable | Bảng tính |\n| B4.2 | Dựng model đó trong Google Sheets: tự tính RTP, hit frequency, SD | 1 sheet |\n| B4.3 | Mô phỏng 10.000 spin trong Sheets (công thức bên dưới). So RTP mô phỏng với RTP lý thuyết, chạy lại 5 lần | Ghi chú vì sao cần sim rất lớn |\n| B4.4 | Làm lại bài Scatter ở 8.4 với xác suất 4%, 8%, 10% mỗi reel | Bảng |\n| B4.5 | Viết RTP split mục tiêu cho game ở Level 3, giải thích bằng lời | Thêm vào yêu cầu math |\n\n**Công thức mô phỏng 1 reel trong Google Sheets**\n\n```\n=INDEX({\"7\",\"BAR\",\"BAR\",\"C\",\"C\",\"C\",\"B\",\"B\",\"B\",\"B\"}, RANDBETWEEN(1,10))\n```\n\n- `{...}`: danh sách 10 vị trí của reel: 1 vị trí 7, 2 BAR, 3 C, 4 B (Blank).\n- `RANDBETWEEN(1,10)`: chọn ngẫu nhiên 1 vị trí từ 1 đến 10.\n- `INDEX(...)`: lấy symbol ở vị trí đó.\n- Đặt công thức ở 3 cột (3 reel), kéo xuống 10.000 dòng, thêm cột tính tiền thắng theo paytable, rồi lấy tổng thắng chia số dòng để ra RTP mô phỏng.\n\n**Tiêu chí đạt:** đọc một PAR sheet công khai (ví dụ trong bài của Harrigan & Dixon, mục 20) và trả lời được 10 câu ở mục 8.7.\n\n### Level 5. Thể loại khác và cổng game (25 giờ)\n**Kiến thức:** mục 2, 10.4, 11.\n\n| Mã | Bài | Output |\n|---|---|---|\n| B5.1 | Rule doc Tiến Lên hoặc Pusoy, đủ edge case ở 11.2 | 1 tài liệu |\n| B5.2 | Spec bắn cá mini: 10 loại cá, 3 phòng, 1 boss, 2 cá đặc biệt | 1 tài liệu |\n| B5.3 | Spec crash game, có màn kiểm tra provably fair | 1 tài liệu và wireframe |\n| B5.4 | IA lobby, flow nạp tiền, rút tiền, công cụ RG trong Figma | Sơ đồ và wireframe |\n| B5.5 | Audit UX lobby của một operator có license, dùng ảnh chụp hoặc video công khai, không đăng ký nạp tiền. Theo khung ở *01 - projects/CLAUDE.md* | Bảng audit |\n\n**Tiêu chí đạt:** flow rút tiền dễ như flow nạp tiền, công cụ RG tới được trong tối đa 2 lần chạm.\n\n### Level 6. Senior: data, series, compliance, pitch (30 giờ)\n**Kiến thức:** mục 4.5, 8.7, 13, 17.\n\n| Mã | Bài | Output |\n|---|---|---|\n| B6.1 | Nhờ Claude tạo một bộ data **giả** (ghi rõ là giả) sau launch của game Level 3. Đọc và viết 复盘 1 trang: cái gì hiệu quả, cái gì không, làm gì tiếp | 1 trang |\n| B6.2 | Kế hoạch series 3 game từ game Level 3: 1 reskin, 1 cải tiến nhỏ, 1 mechanic mới | 1 trang |\n| B6.3 | Ma trận compliance cho game Level 3 ở UK, Đức, Brazil, MGA | 1 bảng |\n| B6.4 | Pitch deck 6 slide, tập pitch 5 phút, quay video tự xem lại | Deck và video |\n| B6.5 | Phỏng vấn thử: nhờ Claude hỏi 20 câu phỏng vấn game designer slot | Ghi chú câu trả lời yếu |\n\n**Tiêu chí đạt:** pitch xong trong 5 phút, trả lời được \"khác gì game X\" bằng mechanic.\n\n---\n\n## 20. Tài nguyên\n\n| Chủ đề | Tài nguyên | Ghi chú |\n|---|---|---|\n| Game design chung | *The Art of Game Design: A Book of Lenses* (Jesse Schell) | Nền tư duy thiết kế |\n| Toán casino | *Practical Casino Math* (Robert C. Hannum, Anthony N. Cabot) | Sách chuẩn về math casino |\n| Toán casino | Wizard of Odds (wizardofodds.com), phần slot | Phân tích math của nhiều game |\n| PAR sheet | [Harrigan & Dixon (2009), Journal of Gambling Issues](https://epe.bac-lac.gc.ca/100/201/300/jrn_gambling_issues/html/2009/no23/issue23/06harrigan.html) · [easy.vegas](https://www.easy.vegas/games/slots/par-
