  $$("tbody tr", t).forEach(tr => {
    const id = tr.cells[0].textContent.trim(), text = tr.cells[1] ? tr.cells[1].textContent.trim() : id;
    const td = document.createElement("td"); td.className = "done";
    td.innerHTML = `<input type="checkbox" data-task="${id}" aria-label="Đã xong ${id}">`;
    tr.prepend(td); tr.id = "task-" + slug(id); tasks.push({ id, text, level: lvl, row: tr });
  });
});

/* ---------- 4. Checklist "- [ ]": bật checkbox, lưu theo vị trí ---------- */
$$("li > input[type=checkbox]", doc).forEach((inp, i) => {
  const li = inp.parentElement; li.classList.add("task"); inp.disabled = false; inp.dataset.check = "cl-" + i;
  const span = document.createElement("span"); while (inp.nextSibling) span.append(inp.nextSibling);
  const lab = document.createElement("label"); lab.append(inp, span); li.append(lab);
});

/* ---------- 5a. Gantt: tự vẽ bằng HTML (mermaid gantt hay lỗi độ rộng). Hiểu cú pháp: "Tên :id, ngày|after id, Nd" ---------- */
function renderGantt(src){
  const rows = [], end = {}; let sec = "", ttl = "", t0 = null;
  src.split("\n").map(s => s.trim()).forEach(l => {
    if (l.startsWith("title ")) ttl = l.slice(6);
    else if (l.startsWith("section ")) sec = l.slice(8);
    else if (l.includes(":") && !/^(dateFormat|axisFormat|gantt)/.test(l)) {
      const [name, spec] = l.split(/\s*:\s*/); const parts = spec.split(",").map(s => s.trim());
      const id = parts.length > 2 ? parts[0] : null, startS = parts[parts.length - 2], dur = parseInt(parts[parts.length - 1]) || 7;
      let start;
      if (/^after /.test(startS)) start = Math.max(...startS.slice(6).split(/\s+/).map(x => end[x] || 0));
      else { const d = new Date(startS); if (t0 === null) t0 = d; start = Math.round((d - t0) / 864e5); }
      if (id) end[id] = start + dur;
      rows.push({ sec, name, start, dur });
    }
  });
  const total = Math.max(...rows.map(r => r.start + r.dur)), weeks = Math.ceil(total / 7);
  const box = document.createElement("div"); box.className = "diagram gantt";
  let lastSec = null;
  box.innerHTML = `<div class="g-title">${ttl}</div><div class="g-axis"><span></span><div>${Array.from({ length: weeks }, (_, i) => `<i>T${i + 1}</i>`).join("")}</div></div>` +
    rows.map(r => { const head = r.sec !== lastSec ? `<div class="g-sec">${(lastSec = r.sec)}</div>` : "";
      return head + `<div class="g-row"><span>${r.name}</span><div><b style="left:${r.start / total * 100}%;width:${r.dur / total * 100}%" title="${r.dur} ngày"></b></div></div>`; }).join("") +
    `<div class="g-note">Tổng khoảng ${weeks} tuần. T = tuần.</div>`;
  return box;
}

/* ---------- 5. Code: mermaid thành sơ đồ, còn lại có nút sao chép ---------- */
$$("pre > code", doc).forEach((code, i) => {
  const pre = code.parentElement;
  if (code.classList.contains("language-mermaid") && /^\s*gantt/.test(code.textContent)) { pre.replaceWith(renderGantt(code.textContent)); return; }
  if (code.classList.contains("language-mermaid")) {
    const d = document.createElement("div"); d.className = "diagram"; const m = document.createElement("div"); m.className = "mermaid"; m.textContent = code.textContent; d.append(m); pre.replaceWith(d); return;
  }
  const box = document.createElement("div"); box.className = "code"; pre.before(box); box.append(pre); pre.id = "code-" + i;
  const b = document.createElement("button"); b.className = "btn small copy"; b.textContent = "Sao chép"; b.dataset.copy = pre.id; box.append(b);
});
const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
if (window.mermaid) { mermaid.initialize({ startOnLoad:false, theme: isDark() ? "dark" : "neutral", securityLevel:"strict", fontFamily:"IBM Plex Sans" }); mermaid.run({ nodes: $$(".mermaid", doc) }).catch(() => {}); }

/* ---------- 6. Link ngoài mở tab mới; BLUF và "dấu hiệu đỏ" được làm nổi ---------- */
$$("a[href^='http']", doc).forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
heads.forEach(h => {
  const nx = h.nextElementSibling; if (!nx || !/^(OL|UL)$/.test(nx.tagName)) return;
  if (/^BLUF/i.test(h.textContent)) nx.classList.add("bluf");
  if (/dấu hiệu đỏ/i.test(h.textContent)) nx.classList.add("redflag");
});

/* ---------- 7. Ô ghi chú cuối mỗi mục H2 ---------- */
const h2s = $$("h2", doc);
h2s.forEach(h => {
  let end = h.nextElementSibling;
  while (end && !/^H[12]$/.test(end.tagName)) end = end.nextElementSibling;
  const d = document.createElement("details"); d.className = "snote";
  d.innerHTML = `<summary>Ghi chú cho mục “${h.textContent.replace(/"/g, "")}”</summary><div class="in"><textarea data-note="${h.id}" aria-label="Ghi chú mục ${h.textContent}"></textarea><div class="saved" data-saved-for="${h.id}"></div></div>`;
  end ? end.before(d) : doc.append(d);
});
$$("[data-note]").forEach(el => { el.value = notes[el.dataset.note] || ""; if (el.value) el.closest("details")?.classList.add("has"); });

/* ---------- 8. Tiến độ ---------- */
$$("[data-task]").forEach(c => c.checked = !!checks[c.dataset.task]);
$$("[data-check]").forEach(c => c.checked = !!checks[c.dataset.check]);
// Gắn bộ đếm vào tiêu đề level (H3 chứa bảng bài tập)
const levelHeads = [...new Set(tasks.map(t => t.level))];
function updateProgress(){
  const done = tasks.filter(t => checks[t.id]).length;
  $$(".js-bar").forEach(b => b.style.width = (tasks.length ? Math.round(done / tasks.length * 100) : 0) + "%");
  $$(".js-done").forEach(e => e.textContent = done); $$(".js-total").forEach(e => e.textContent = tasks.length);
  tasks.forEach(t => t.row.classList.toggle("is-done", !!checks[t.id]));
  levelHeads.forEach(lv => {
    const h = heads.find(x => x.textContent.startsWith(lv) || x.textContent === lv); if (!h) return;
    const list = tasks.filter(t => t.level === lv), d = list.filter(t => checks[t.id]).length;
    let c = h.querySelector(".lvl-count"); if (!c) { c = document.createElement("span"); c.className = "lvl-count"; h.append(c); }
    c.textContent = `${d}/${list.length}`; c.classList.toggle("full", d === list.length);
  });
  const next = tasks.find(t => !checks[t.id]);
  $("#nextText").textContent = next ? `${next.id}: ${next.text}` : (tasks.length ? "Đã xong mọi bài tập." : "Tài liệu này không có bảng bài tập.");
  $("#nextBtn").dataset.row = next ? next.row.id : ""; $("#nextBtn").style.display = next ? "" : "none";
  $("#sumNotes").textContent = `${Object.values(notes).filter(v => v && v.trim()).length} ghi chú`;
}
document.addEventListener("change", e => {
  const t = e.target, k = t.dataset.task || t.dataset.check; if (!k) return;
  checks[k] = t.checked; store.set("checks", checks); updateProgress();
});
$("#nextBtn").addEventListener("click", e => {
  e.preventDefault(); const r = document.getElementById(e.currentTarget.dataset.row); if (!r) return;
  r.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center" }); r.querySelector("input").focus({ preventScroll:true });
});

/* ---------- 9. Lưu ghi chú, sao chép, xuất file ---------- */
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.note) return; const k = el.dataset.note; clearTimeout(el._t);
  el._t = setTimeout(() => { // đợi ngừng gõ 400ms rồi lưu
    notes[k] = el.value; const ok = store.set("notes", notes);
    el.closest("details")?.classList.toggle("has", !!el.value.trim());
    const s = document.querySelector(`[data-saved-for="${k}"]`); if (s) s.textContent = ok ? "Đã lưu" : "Không lưu được: trình duyệt chặn bộ nhớ. Hãy xuất file .md";
    updateProgress();
  }, 400);
});
document.addEventListener("click", e => { const b = e.target.closest("[data-copy]"); if (b) copyText(document.getElementById(b.dataset.copy).textContent); });
$("#exportBtn").addEventListener("click", () => {
  const d = new Date(), p = n => String(n).padStart(2, "0"), day = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  let md = `# Tiến độ: ${title} (${day})\n\nĐã xong ${tasks.filter(t => checks[t.id]).length}/${tasks.length} bài tập.\n`;
  levelHeads.forEach(lv => { md += `\n## ${lv}\n\n` + tasks.filter(t => t.level === lv).map(t => `- [${checks[t.id] ? "x" : " "}] ${t.id}: ${t.text}`).join("\n") + "\n"; });
  const sec = h2s.filter(h => notes[h.id] && notes[h.id].trim());
  if (sec.length) md += `\n## Ghi chú theo mục\n` + sec.map(h => `\n### ${h.textContent}\n\n${notes[h.id]}\n`).join("");
  if (notes.general) md += `\n## Ghi chú chung\n\n${notes.general}\n`;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([md], { type:"text/markdown" })); a.download = `${KEY.replace(/:$/, "")}-tien-do-${day}.md`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Đã xuất file .md");
});
$("#resetBtn").addEventListener("click", () => {
  if (!confirm("Xóa toàn bộ tiến độ và ghi chú trên trình duyệt này? Không hoàn tác được. Nên xuất file .md trước.")) return;
  checks = {}; notes = {}; store.set("checks", checks); store.set("notes", notes);
  $$("[data-task],[data-check]").forEach(c => c.checked = false); $$("[data-note]").forEach(el => el.value = ""); $$("details.snote").forEach(d => d.classList.remove("has"));
  updateProgress(); toast("Đã xóa");
});

/* ---------- 10. Drawer, mục lục mobile, theme, scrollspy ---------- */
const drawer = $("#drawer"), nScrim = $("#nScrim"), side = $("#side"), scrim = $("#scrim");
const openNotes = () => { closeSide(); drawer.classList.add("show"); nScrim.classList.add("show"); drawer.setAttribute("aria-hidden", "false"); setTimeout(() => $("#genNote").focus(), 50); };
const closeNotes = () => { drawer.classList.remove("show"); nScrim.classList.remove("show"); drawer.setAttribute("aria-hidden", "true"); };
function closeSide(){ side.classList.remove("show"); scrim.classList.remove("show"); $("#tocBtn").setAttribute("aria-expanded", "false"); }
$$("[data-open-notes]").forEach(b => b.addEventListener("click", openNotes));
$("#drawerClose").addEventListener("click", closeNotes); nScrim.addEventListener("click", closeNotes); scrim.addEventListener("click", closeSide);
$("#tocBtn").addEventListener("click", () => { const on = !side.classList.contains("show"); side.classList.toggle("show", on); scrim.classList.toggle("show", on); $("#tocBtn").setAttribute("aria-expanded", on); });
$("#toc").addEventListener("click", e => { if (e.target.closest("a")) closeSide(); });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeNotes(); closeSide(); } });
const applyTheme = t => t ? document.documentElement.setAttribute("data-theme", t) : document.documentElement.removeAttribute("data-theme");
applyTheme(store.get("theme", ""));
$("#themeBtn").addEventListener("click", () => { const n = isDark() ? "light" : "dark"; applyTheme(n); store.set("theme", n); toast("Tải lại trang để sơ đồ đổi màu theo"); });
const tocLinks = $$("#toc a");
const spy = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) tocLinks.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id)); }), { rootMargin:"-15% 0px -75% 0px" });
h2s.forEach(h => spy.observe(h));

updateProgress();
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
