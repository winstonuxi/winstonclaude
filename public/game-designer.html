<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Game designer iGaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- IBM Plex: hợp không khí "tài liệu spec", hỗ trợ tiếng Việt -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- marked: chuyển markdown thành HTML. mermaid: vẽ sơ đồ flowchart, gantt -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
/* ============================================================
   TOKENS. Màu nhấn = xanh nỉ bàn casino; đỏ chip dùng cho cảnh báo, dấu hiệu đỏ.
   ============================================================ */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#E5EAE7; --ink:#142019; --muted:#4E5A53; --faint:#7E8A83; --line:#D6DDD8;
  --accent:#0F6B4C; --accent-soft:#DDEFE6; --accent-ink:#FFFFFF; --red:#B3261E; --red-soft:#FBE6E3; --ok:#1C7C4E;
  --font:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif; --side:280px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#17201B; --surface-2:#1F2A24; --ink:#E6EEE9; --muted:#A3B1A9; --faint:#76847C; --line:#2A3630;
    --accent:#4CC38A; --accent-soft:#163327; --accent-ink:#06150E; --red:#F2867A; --red-soft:#3A1E1B; --ok:#4CC38A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#17201B; --surface-2:#1F2A24; --ink:#E6EEE9; --muted:#A3B1A9; --faint:#76847C; --line:#2A3630;
  --accent:#4CC38A; --accent-soft:#163327; --accent-ink:#06150E; --red:#F2867A; --red-soft:#3A1E1B; --ok:#4CC38A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:24px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.68 var(--font);font-family:var(--font),var(--zh);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.brand{font-weight:700;font-size:16px;line-height:1.3;color:var(--ink);text-decoration:none}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.prog{font-size:13px;color:var(--muted);margin-top:6px}
.toc{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.toc .grp{font-size:12px;font-weight:600;color:var(--faint);margin:12px 0 3px 8px}
.toc a{display:block;padding:4px 8px;border-radius:6px;color:var(--muted);text-decoration:none;line-height:1.35}
.toc a:hover{background:var(--surface-2);color:var(--ink)}
.toc a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.side-actions{margin-top:auto;display:flex;gap:8px;padding-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{height:30px;padding:0 10px;font-size:12.5px}
.side-actions .btn{flex:1}
.topbar{display:none}
.main{min-width:0;padding:28px clamp(16px,4vw,56px) 96px}

/* Hero */
.hero{max-width:860px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:14px;padding:clamp(20px,3.5vw,36px);margin-bottom:40px}
.hero h1{font-size:clamp(26px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:0 0 18px;font-weight:700}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.next p{margin:0}.next .lbl{display:block;font-size:12.5px;color:var(--muted)}
.next .meter{grid-column:1/-1}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* Nội dung markdown */
.doc{max-width:860px}
.doc h1{font-size:13px;font-weight:600;color:var(--faint);letter-spacing:.02em;border-top:1px solid var(--line);padding-top:14px;margin:72px 0 6px}
.doc h2{font-size:clamp(22px,2.6vw,28px);line-height:1.2;letter-spacing:-.015em;margin:56px 0 14px;font-weight:700}
.doc h3{font-size:18.5px;margin:32px 0 10px;font-weight:600;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.doc h4{font-size:16px;margin:22px 0 8px}
.doc p,.doc ul,.doc ol{margin:0 0 14px}
.doc ul,.doc ol{padding-left:22px}
.doc li{margin:4px 0}
.doc strong{font-weight:600}
.doc code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.doc hr{display:none}
.doc blockquote{margin:0 0 18px;padding:12px 16px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:15px}
.doc blockquote p:last-child{margin:0}
.tbl{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55}
.doc th,.doc td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
.doc th{font-weight:600;font-size:13px;color:var(--muted);background:var(--surface-2)}
.doc tr:last-child td{border-bottom:0}
.doc td code{white-space:nowrap}
.code{position:relative;margin:0 0 18px}
.code pre{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;padding-right:92px;overflow-x:auto;font:12.5px/1.65 var(--mono);white-space:pre-wrap;word-break:break-word}
.code pre code{background:none;padding:0;font-size:inherit}
.code .copy{position:absolute;top:8px;right:8px}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 18px;overflow-x:auto;text-align:center}
.diagram svg{max-width:100%;height:auto}
/* Gantt tự vẽ */
.gantt{text-align:left;font-size:13px;min-width:0}
.g-title{font-weight:600;margin-bottom:10px}
.g-axis,.g-row{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:10px;align-items:center}
.g-axis div{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--faint)}
.g-axis i{font-style:normal;flex:1;text-align:left;border-left:1px solid var(--line);padding-left:2px}
.g-sec{font-size:12px;font-weight:600;color:var(--faint);margin:10px 0 4px}
.g-row{margin:3px 0}
.g-row > span{color:var(--muted);line-height:1.3}
.g-row > div{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.g-row b{position:absolute;top:0;height:100%;background:var(--accent);border-radius:4px}
.g-note{margin-top:10px;font-size:12px;color:var(--faint)}
/* Mục BLUF và cảnh báo đỏ */
.bluf{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 18px 6px 38px}
.redflag{background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;padding:12px 16px 4px 34px}

/* Checkbox bài tập và checklist */
td.done{width:44px;text-align:center}
td.done input,.doc li > input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;vertical-align:-3px}
tr.is-done td:not(.done){color:var(--faint)}
.doc li.task{list-style:none;margin-left:-22px}
.doc li.task label{display:flex;gap:10px;cursor:pointer}
.doc li.task input:checked + span{color:var(--faint);text-decoration:line-through}
.lvl-count{font:500 12.5px var(--mono);color:var(--faint);background:var(--surface-2);padding:2px 8px;border-radius:99px}
.lvl-count.full{color:var(--accent);background:var(--accent-soft)}

/* Ghi chú cuối mỗi mục */
details.snote{margin:8px 0 0;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
details.snote > summary{cursor:pointer;padding:9px 14px;font-size:13.5px;color:var(--muted);list-style:none}
details.snote > summary::-webkit-details-marker{display:none}
details.snote > summary::before{content:"+ ";color:var(--faint)}
details.snote[open] > summary::before{content:"– "}
details.snote.has > summary{color:var(--accent);font-weight:500}
details.snote .in{padding:0 14px 12px}
textarea{width:100%;min-height:96px;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.saved{font-size:12px;color:var(--faint);height:15px;margin-top:4px}

/* Drawer, toast */
.scrim{position:fixed;inset:0;background:rgba(5,10,8,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;gap:12px;padding:20px;overflow-y:auto}
.drawer.show{transform:none}
.drawer h2{margin:0;font-size:21px}
.drawer textarea{min-height:200px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{color:var(--muted);padding:40px 0}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,.toast,.meter span{transition:none}}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88%);z-index:41;transform:translateX(-100%);transition:transform .25s;height:100%}
  .side.show{transform:none}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar .t{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  html{scroll-padding-top:66px}
}
@media (max-width:640px){ .next{grid-template-columns:1fr} .next .btn{justify-self:start} .doc th,.doc td{padding:8px 9px} }
</style>
</head>
<body>
<div class="topbar">
  <button class="btn small" id="tocBtn" aria-expanded="false">Mục lục</button>
  <span class="t" id="topTitle"></span>
  <button class="btn small" data-open-notes>Ghi chú</button>
</div>
<div class="app">
  <aside class="side" id="side" aria-label="Mục lục">
    <a class="brand" href="#top" id="brand"></a>
    <div><div class="meter"><span class="js-bar"></span></div><div class="prog"><span class="js-done">0</span>/<span class="js-total">0</span> bài tập đã xong</div></div>
    <nav class="toc" id="toc"></nav>
    <div class="side-actions"><button class="btn" data-open-notes>Ghi chú</button><button class="btn" id="themeBtn" aria-label="Đổi giao diện sáng hoặc tối">Sáng / tối</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="top">
    <header class="hero">
      <h1 id="heroTitle"></h1>
      <div class="next">
        <p><span class="lbl">Bài tiếp theo của bạn</span><strong id="nextText">Đang tải…</strong></p>
        <a class="btn primary" id="nextBtn" href="#">Mở bài này</a>
        <div class="meter"><span class="js-bar"></span></div>
      </div>
      <div class="meta"><button class="btn small" data-open-notes>Ghi chú chung, xuất file</button><span class="btn small" style="cursor:default" id="sumNotes">0 ghi chú</span></div>
    </header>
    <article class="doc" id="doc"><p class="loading">Đang dựng nội dung…</p></article>
  </main>
</div>

<div class="scrim" id="nScrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Ghi chú">
  <div class="row" style="justify-content:space-between;align-items:center"><h2>Ghi chú</h2><button class="btn small" id="drawerClose">Đóng</button></div>
  <p style="margin:0;font-size:13px;color:var(--faint)">Tự lưu trên trình duyệt này. Xuất file .md để cất vào vault. Mỗi mục trong bài còn có ô ghi chú riêng ở cuối mục.</p>
  <textarea id="genNote" data-note="general" placeholder="Ghi chú chung…"></textarea>
  <div class="saved" data-saved-for="general"></div>
  <div class="row"><button class="btn primary" id="exportBtn">Xuất tiến độ và ghi chú (.md)</button></div>
  <div class="row"><button class="btn small" id="resetBtn">Xóa toàn bộ tiến độ và ghi chú</button></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* Nội dung markdown được script build nhúng vào đây */
const MD = "\n# Giáo trình Game Designer ngành iGaming: slot, casino, bắn cá, game bài, cổng game (từ cơ bản đến nâng cao)\n\n> **Góc nhìn:** senior game designer ở studio slot, quen quy trình của studio Trung Quốc làm game cho thị trường nước ngoài (出海).\n> **Phạm vi:** thiết kế sản phẩm: theme và story, gameplay, feature, presentation, UX, viết spec, và hiểu math đủ để đặt yêu cầu và đọc kết quả. **Không** bàn vận hành casino, cách kéo người chơi hay cách lách luật. Học để làm cho studio hoặc khách **có license** (xem Guardrails iGaming trong *01 - projects/CLAUDE.md*).\n> **Độ tin cậy:** chỗ nào có nguồn thì có link. Chỗ ghi **(kinh nghiệm nghề)** là cách làm phổ biến trong nghề nhưng chưa có tài liệu công khai, cần tự kiểm chứng khi làm dự án thật. Số giờ, timeline và mọi con số ví dụ đều là **ước tính**. Nhiều nguồn ngành là blog của vendor bán dịch vụ, đã ghi chú khi dùng.\n> **Không trùng lặp:** phần vẽ asset nằm ở [giao-trinh-digital-art-slot-2026-11-08](digital-art.html), phần AI ở *game-ui-ai-workflow-2026-11-04*. Note này lo phần **thiết kế game và viết spec**.\n\n## BLUF\n1. **Game designer ngành này là người viết \"hợp đồng\" giữa 4 phòng: math, art, client dev, server dev.** Sản phẩm chính của bạn là tài liệu: one-pager → GDD → yêu cầu math → danh sách asset → spec animation → tiêu chí nghiệm thu. Spec tốt là spec mà dev làm được mà không phải hỏi lại.\n2. **Không cần làm math, nhưng phải nói được ngôn ngữ của math:** RTP, hit frequency, volatility, trigger rate, RTP split, max win. Không hiểu các chữ này thì không viết được GDD và không phản biện được math designer (mục 8).\n3. **Studio TQ làm theo dây chuyền 8 bước có điểm duyệt**, và ra game rất nhanh (một nguồn ngành nói 2–4 game/tháng là bình thường) nhờ dùng lại khung code và math, chỉ thay theme (换皮) hoặc thêm một feature nhỏ. Game có mechanic mới mất khoảng 3–6 tháng, reskin khoảng 4–6 tuần (mục 4).\n4. **Đường nhanh nhất cho Winston:** Slot UI/UX designer → Game designer phụ trách feature và presentation (nhịp, animation, win celebration, UX). Math designer (数值策划) là một nghề khác, cần nền toán thống kê, không nên nhắm.\n5. **Lộ trình 7 level (0–6), khoảng 180 giờ** (mục 19). Học xong Level 3 (khoảng 95 giờ) là viết được GDD đủ cho dev làm, và có một bộ tài liệu mẫu cho portfolio acehaus.\n6. **Ranh giới:** TQ đại lục không có thị trường slot tiền thật hợp pháp, nên studio TQ làm game cho nước ngoài, và nhiều nơi hoạt động ở vùng xám. Dấu hiệu đỏ: 点控 hoặc 杀率 (chỉnh tỷ lệ thắng theo từng người chơi), hệ thống đại lý đa cấp (代理), không có chứng nhận của test lab. Gặp thì từ chối (mục 13.4).\n\n**Bước tiếp theo trong tuần này:** đọc mục 1–3 và mục 21 (Từ điển), khoảng 3 giờ. Sau đó làm bài **B1.1**: chơi **bản demo** (không nạp tiền) 5 game slot của 5 studio khác nhau, điền bảng teardown ở mục 19.\n\n> **Quỹ học:** giáo trình này (khoảng 180 giờ) cộng giáo trình Digital Art (khoảng 300 giờ) là khoảng 480 giờ, quá sức quỹ 1 giờ/ngày nếu học song song. Đề xuất học Level 0–2 của note này trước (khoảng 55 giờ), vì từ vựng và quy trình làm cho mọi việc khác dễ hơn: vẽ asset đúng nhu cầu, nói chuyện với khách, đi phỏng vấn. Thứ tự cuối cùng là quyết định của Winston.\n\n---\n\n## Mục lục\n**Phần A. Nền tảng**\n1. Bản đồ ngành: ai làm gì, tiền đi đâu\n2. Các thể loại game và cổng game\n3. Vai trò trong studio, game designer làm gì\n\n**Phần B. Quy trình**\n4. Quy trình làm game mới của studio TQ\n5. Theme và game story\n\n**Phần C. Kiến thức chuyên môn**\n6. Slot: cấu trúc cơ bản\n7. Thư viện feature\n8. Math cho designer\n9. Presentation: nhịp, animation, âm thanh\n10. UX/UI cho slot và cổng game\n11. Bắn cá, game bài, table game, crash\n12. Kỹ thuật đủ để nói chuyện với dev\n13. Compliance và chơi có trách nhiệm\n\n**Phần D. Viết spec và trình bày**\n14. Bộ tài liệu chuẩn\n15. One-pager (立项)\n16. GDD và các spec đi kèm\n17. Pitch ý tưởng\n18. Làm việc với từng phòng\n\n**Phần E. Học**\n19. Lộ trình 7 level và bài tập\n20. Tài nguyên\n21. Từ điển thuật ngữ Anh –
